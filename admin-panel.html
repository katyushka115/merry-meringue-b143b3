<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SM Flowers — админка</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font:14px Arial;background:#f5f1eb;color:#20251f;margin:0}.wrap{max-width:1150px;margin:25px auto;padding:0 14px}.card{background:white;border-radius:16px;padding:20px;margin-bottom:16px}input,textarea{width:100%;box-sizing:border-box;padding:10px;margin:5px 0 12px;border:1px solid #ddd;border-radius:9px}button,a.btn{padding:10px 14px;border:0;border-radius:9px;background:#263125;color:white;cursor:pointer;text-decoration:none;display:inline-block}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.row{border-top:1px solid #eee;padding:15px 0}.thumb{width:130px;height:100px;object-fit:cover;border-radius:10px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section id="login" class="card"><h1>SM Flowers — админка</h1><form id="loginForm"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Пароль" required><button>Войти</button></form><p id="loginMsg"></p></section><section id="app" style="display:none"><div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h1>SM Flowers — админка</h1><button id="logout">Выйти</button></div><div id="user"></div><nav class="tabs"><button data-tab="products">Букеты</button><a class="btn" href="/admin/editor">Редактор сайта</a><button data-tab="orders">Заказы</button><button data-tab="settings">Настройки</button></nav></div><section id="products" class="card"><h2>Букеты</h2><div class="grid"><div id="productsList"></div><form id="productForm"><input id="pid" type="hidden"><input id="pname" placeholder="Название" required><input id="pprice" type="number" placeholder="Цена" required><textarea id="pdesc" placeholder="Описание"></textarea><input id="pfile" type="file" accept="image/*"><label><input id="pactive" type="checkbox" checked> Показывать</label><button>Сохранить букет</button><p id="pmsg"></p></form></div></section><section id="orders" class="card" style="display:none"><h2>Заказы</h2><div id="ordersList"></div></section><section id="settings" class="card" style="display:none"><h2>Настройки</h2><div id="settingsList"></div></section></section></main><script>(()=>{const db=supabase.createClient(location.origin+'/supabase','sb_publishable_3FgdTAmKB8kw2QTrrVPA5g_vb1lya1d',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}}),BUCKET='bouquets',$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const media=p=>'/media/'+p;async function upload(f){if(!f)return null;const ext=(f.name.split('.').pop()||'jpg').toLowerCase(),path='products/'+crypto.randomUUID()+'.'+ext,r=await db.storage.from(BUCKET).upload(path,f,{contentType:f.type,upsert:false});if(r.error)throw r.error;return media(path)}async function admin(){const r=await db.rpc('is_admin');if(r.error||r.data!==true)throw new Error(r.error?.message||'Нет прав администратора');return(await db.auth.getUser()).data.user}async function loadProducts(){const r=await db.from('products').select('*').order('sort_order').order('id');if(r.error){$('productsList').textContent=r.error.message;return}$('productsList').innerHTML=(r.data||[]).map(p=>`<div class="row"><img class="thumb" src="${esc(p.image_url||'/media/hero.jpg')}"><b>${esc(p.name)}</b> — ${Number(p.price||0).toLocaleString('ru-RU')} ₽ <button data-edit="${p.id}">Изменить</button></div>`).join('')||'Нет букетов';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const p=r.data.find(x=>String(x.id)===b.dataset.edit);$('pid').value=p.id;$('pname').value=p.name;$('pprice').value=p.price;$('pdesc').value=p.description||'';$('pactive').checked=p.is_active!==false})}async function loadOrders(){const r=await db.from('orders').select('id,status,total_amount,delivery_address,delivery_date,delivery_time,created_at,customers(name,phone,email),order_items(product_name,quantity,price)').order('created_at',{ascending:false});if(r.error){$('ordersList').textContent=r.error.message;return}$('ordersList').innerHTML=(r.data||[]).map(o=>`<div class="row"><b>Заказ #${o.id}</b> — ${esc(o.status||'new')} — ${Number(o.total_amount||0).toLocaleString('ru-RU')} ₽<br>${esc(o.customers?.name||'')} ${esc(o.customers?.phone||'')}<br>${esc(o.delivery_address||'')} ${esc(o.delivery_date||'')} ${esc(o.delivery_time||'')}</div>`).join('')||'Заказов пока нет'}async function loadSettings(){const r=await db.from('store_settings').select('*').limit(1).maybeSingle();if(r.error||!r.data){$('settingsList').textContent='Настройки не найдены';return}const d=r.data;$('settingsList').innerHTML=Object.keys(d).map(k=>`<label>${esc(k)}<input data-setting="${esc(k)}" value="${esc(d[k])}"></label>`).join('')+'<button id="saveSettings">Сохранить</button>';$('saveSettings').onclick=async()=>{const p={};document.querySelectorAll('[data-setting]').forEach(i=>p[i.dataset.setting]=i.value);const r=await db.from('store_settings').update(p).eq('id',d.id);alert(r.error?'Ошибка: '+r.error.message:'Сохранено')}}async function init(){const s=await db.auth.getSession();if(!s.data.session)return;const u=await admin();$('login').style.display='none';$('app').style.display='block';$('user').textContent=u.email||'';await Promise.all([loadProducts(),loadOrders(),loadSettings()])}$('loginForm').onsubmit=async e=>{e.preventDefault();try{const r=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(r.error)throw r.error;await init()}catch(e){$('loginMsg').textContent=e.message}};$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{['products','orders','settings'].forEach(x=>$(x).style.display=x===b.dataset.tab?'block':'none')});$('productForm').onsubmit=async e=>{e.preventDefault();try{const id=$('pid').value,f=$('pfile').files[0];let image=null;if(f)image=await upload(f);const payload={name:$('pname').value.trim(),price:Number($('pprice').value),description:$('pdesc').value.trim(),is_active:$('pactive').checked};if(image)payload.image_url=image;const r=id?await db.from('products').update(payload).eq('id',id):await db.from('products').insert(payload);if(r.error)throw r.error;$('pmsg').textContent='Сохранено';$('productForm').reset();$('pid').value='';$('pactive').checked=true;loadProducts()}catch(e){$('pmsg').textContent=e.message}};init()})();</script></body></html>
