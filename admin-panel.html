<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>SM Flowers — админка</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#f5f1eb;color:#20251f;font:14px/1.5 Arial,sans-serif}.wrap{max-width:1100px;margin:30px auto;padding:0 16px}.card{background:#fff;border:1px solid #e7e1d8;border-radius:18px;padding:22px}.login{max-width:460px;margin:12vh auto}h1,h2,h3{margin-top:0}label{display:block;font-weight:700;margin:13px 0 6px}input,textarea,select{width:100%;padding:11px;border:1px solid #d9d4cc;border-radius:10px;background:#fff}button{border:0;border-radius:10px;padding:11px 15px;background:#263125;color:#fff;cursor:pointer}.secondary{background:#eee9e1;color:#222}.danger{background:#a83d35}.hidden{display:none!important}.msg{min-height:22px;margin-top:10px}.error{color:#b3261e}.success{color:#287a45}.tabs{display:flex;gap:8px;margin:18px 0;flex-wrap:wrap}.tab.active{background:#263125;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.actions{display:flex;gap:8px;flex-wrap:wrap}.preview{width:100%;max-height:280px;object-fit:cover;border-radius:12px;background:#eee;margin:8px 0}.item{display:grid;grid-template-columns:90px 1fr auto;gap:12px;align-items:center;border-top:1px solid #eee;padding:13px 0}.thumb{width:90px;height:90px;object-fit:cover;border-radius:10px;background:#eee}.order{margin:12px 0;padding:18px;border:1px solid #e7e1d8;border-radius:14px}.order-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 22px;margin-top:12px}.field{padding:8px 0;border-top:1px solid #eee}.field b{display:block;color:#5c625a;margin-bottom:3px}.comment{margin-top:12px;padding:12px;background:#f7f3ed;border-radius:10px}.status{display:inline-block;padding:5px 9px;border-radius:999px;background:#eee9e1}.editor-nav{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.editor-nav button.active{background:#263125;color:#fff}.editor-panel{border:1px solid #e7e1d8;border-radius:14px;padding:16px}.editor-item{border-top:1px solid #eee;padding:14px 0}.editor-item:first-child{border-top:0}.editor-item img{display:block;width:180px;height:130px;object-fit:cover;border-radius:10px;margin:8px 0}.muted{color:#687064}@media(max-width:760px){.grid,.order-grid{grid-template-columns:1fr}.item{grid-template-columns:65px 1fr}.item .actions{grid-column:2}.thumb{width:65px;height:65px}.editor-nav{grid-template-columns:1fr 1fr}.wrap{margin:16px auto;padding:0 10px}.card{padding:16px}}</style></head><body><div id="login" class="wrap login card"><h1>SM Flowers</h1><p>Вход в панель управления</p><form id="login-form"><label>Email</label><input id="email" type="email" autocomplete="username" required><label>Пароль</label><input id="password" type="password" autocomplete="current-password" required><button id="login-button" type="submit" style="margin-top:15px">Войти</button></form><div id="login-msg" class="msg"></div></div><div id="app" class="wrap hidden"><header style="display:flex;justify-content:space-between;align-items:center;gap:12px"><div><h1>SM Flowers — админка</h1><div id="user-email"></div></div><button id="logout" class="secondary">Выйти</button></header><nav class="tabs"><button class="tab active" data-tab="products">Букеты</button><button class="tab" data-tab="editor">Редактор сайта</button><button class="tab" data-tab="orders">Заказы</button><button class="tab" data-tab="settings">Настройки</button></nav><section id="products-tab"><div class="grid"><div class="card"><h2>Букеты</h2><div id="products"></div></div><div class="card"><h2>Новый / изменить букет</h2><form id="product-form"><input id="pid" type="hidden"><label>Название</label><input id="pname" required><label>Цена</label><input id="pprice" type="number" min="0" step="0.01" required><label>Описание</label><textarea id="pdesc"></textarea><label>Фото</label><input id="pimage" type="file" accept="image/jpeg,image/png,image/webp"><img id="pimage-preview" class="preview hidden"><label><input id="pactive" type="checkbox" checked style="width:auto"> Активен</label><div class="actions"><button>Сохранить</button><button id="clear" type="button" class="secondary">Очистить</button></div></form><div id="product-msg" class="msg"></div></div></div></section><section id="editor-tab" class="hidden"><div class="card"><h2>Редактор сайта</h2><p class="muted">Каждый блок открывается отдельно. Выберите блок, отредактируйте его текст и фотографии, сохраните и закройте. Заказы остаются отдельным разделом.</p><div id="editor-nav" class="editor-nav"></div><div id="editor-panel" class="editor-panel">Выберите блок.</div></div></section><section id="orders-tab" class="hidden"><div class="card"><h2>Заказы</h2><div id="orders"></div></div></section><section id="settings-tab" class="hidden"><div class="card"><h2>Настройки магазина</h2><form id="settings-form"><label>Название</label><input id="sname"><label>Телефон</label><input id="sphone"><label>Telegram</label><input id="stelegram"><label>Instagram</label><input id="sinstagram"><button style="margin-top:15px">Сохранить</button></form><div id="settings-msg" class="msg"></div></div></section></div><script>(()=>{const db=supabase.createClient(location.origin+'/supabase','sb_publishable_3FgdTAmKB8kw2QTrrVPA5g_vb1lya1d',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}}),BUCKET='bouquets',$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const media=u=>{if(!u)return'';if(u.startsWith('/media/'))return u;try{const x=new URL(u),needle=`/storage/v1/object/public/${BUCKET}/`,i=x.pathname.indexOf(needle);return i>=0?'/media/'+x.pathname.slice(i+needle.length):u}catch{return u}};async function admin(){const r=await db.rpc('is_admin');if(r.error||r.data!==true)throw new Error(r.error?.message||'Нет прав администратора');const u=await db.auth.getUser();return u.data.user}async function upload(file,folder){const ext=(file.name.split('.').pop()||'jpg').toLowerCase(),path=`${folder}/${crypto.randomUUID()}.${ext}`,r=await db.storage.from(BUCKET).upload(path,file,{upsert:false,contentType:file.type});if(r.error)throw r.error;return '/media/'+path}async function openApp(u){$('user-email').textContent=u.email||'';$('login').classList.add('hidden');$('app').classList.remove('hidden');await Promise.all([loadProducts(),loadOrders(),loadSettings()])}$('login-form').onsubmit=async e=>{e.preventDefault();$('login-button').disabled=true;try{const r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)throw r.error;await openApp(await admin())}catch(x){$('login-msg').textContent=x.message||String(x)}finally{$('login-button').disabled=false}};$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');['products','editor','orders','settings'].forEach(x=>$(x+'-tab').classList.toggle('hidden',x!==b.dataset.tab));if(b.dataset.tab==='editor')loadEditor();if(b.dataset.tab==='orders')loadOrders()});async function loadProducts(){const r=await db.from('products').select('*').order('sort_order').order('id');if(r.error){$('products').textContent=r.error.message;return}$('products').innerHTML=(r.data||[]).map(p=>`<div class="item"><img class="thumb" src="${esc(media(p.image_url))}"><div><b>${esc(p.name)}</b><div>${Number(p.price||0).toLocaleString('ru-RU')} ₽</div><small>${p.is_active?'Активен':'Скрыт'}</small></div><div class="actions"><button class="secondary edit" data-id="${p.id}">Изменить</button><button class="danger del" data-id="${p.id}">Удалить</button></div></div>`).join('')||'Букетов нет';document.querySelectorAll('.edit').forEach(b=>b.onclick=()=>edit((r.data||[]).find(p=>String(p.id)===b.dataset.id)));document.querySelectorAll('.del').forEach(b=>b.onclick=async()=>{if(!confirm('Удалить букет?'))return;const q=await db.from('products').delete().eq('id',b.dataset.id);if(q.error)alert(q.error.message);else loadProducts()})}function edit(p){$('pid').value=p.id;$('pname').value=p.name;$('pprice').value=p.price;$('pdesc').value=p.description||'';$('pactive').checked=p.is_active!==false;$('pimage-preview').src=media(p.image_url);$('pimage-preview').classList.remove('hidden')}function clear(){document.getElementById('product-form').reset();$('pid').value='';$('pactive').checked=true;$('pimage-preview').classList.add('hidden')}$('clear').onclick=clear;$('pimage').onchange=e=>{const f=e.target.files[0];if(f){$('pimage-preview').src=URL.createObjectURL(f);$('pimage-preview').classList.remove('hidden')}};$('product-form').onsubmit=async e=>{e.preventDefault();try{const id=$('pid').value,f=$('pimage').files[0];let image=null;if(id){const old=await db.from('products').select('image_url').eq('id',id).single();if(old.error)throw old.error;image=old.data.image_url}if(f)image=await upload(f,'products');const payload={name:$('pname').value.trim(),price:Number($('pprice').value),description:$('pdesc').value.trim(),is_active:$('pactive').checked};if(image)payload.image_url=image;const q=id?await db.from('products').update(payload).eq('id',id):await db.from('products').insert(payload);if(q.error)throw q.error;clear();loadProducts()}catch(x){$('product-msg').textContent=x.message||String(x)}};async function loadOrders(){const r=await db.from('orders').select('id,status,total_amount,delivery_address,delivery_date,delivery_time,comment,created_at,customers(name,phone,email),order_items(product_name,quantity,price)').order('created_at',{ascending:false});if(r.error){$('orders').textContent=r.error.message;return}$('orders').innerHTML=(r.data||[]).map(o=>{const created=o.created_at?new Date(o.created_at).toLocaleString('ru-RU',{dateStyle:'short',timeStyle:'short'}):'—',dd=o.delivery_date?new Date(o.delivery_date+'T00:00:00').toLocaleDateString('ru-RU'):'';return `<article class="order"><div><b>Заказ #${o.id}</b> <span class="status">${esc(o.status||'new')}</span></div><div class="order-grid"><div class="field"><b>Клиент</b>${esc(o.customers?.name||'—')}<br>${esc(o.customers?.phone||'')}<br>${esc(o.customers?.email||'')}</div><div class="field"><b>Создан</b>${created}<br><b>Сумма</b>${Number(o.total_amount||0).toLocaleString('ru-RU')} ₽</div><div class="field"><b>Доставка</b>${esc(o.delivery_address||'—')}<br>${dd?esc(dd):''}${o.delivery_time?' · '+esc(o.delivery_time):''}</div><div class="field"><b>Состав</b>${(o.order_items||[]).map(i=>`${esc(i.product_name||'')} × ${esc(i.quantity||1)} — ${Number(i.price||0).toLocaleString('ru-RU')} ₽`).join('<br>')||'—'}</div></div>${o.comment?`<div class="comment"><b>Комментарий:</b><br>${esc(o.comment)}</div>`:''}</article>`}).join('')||'Заказов пока нет'}async function loadSettings(){const r=await db.from('store_settings').select('*').limit(1).maybeSingle();if(r.error||!r.data){$('settings-form').style.display='none';return}const d=r.data;[['sname','name'],['sphone','phone'],['stelegram','telegram'],['sinstagram','instagram']].forEach(([a,b])=>$(a).value=d[b]||'');$('settings-form').onsubmit=async e=>{e.preventDefault();const q=await db.from('store_settings').update({name:$('sname').value,phone:$('sphone').value,telegram:$('stelegram').value,instagram:$('sinstagram').value}).eq('id',d.id);$('settings-msg').textContent=q.error?q.error.message:'Сохранено'}}const blocks=[['home','Главная'],['studio','О студии'],['collections','Коллекции'],['custom','На заказ'],['bouquets','Букеты'],['philosophy','Философия'],['life','Жизнь студии'],['final','Финальный блок'],['contacts','Контакты']];const photoBlocks=new Set(['home','collections','custom','bouquets','life','final']);async function loadEditor(){const nav=$('editor-nav');nav.innerHTML=blocks.map(([id,n])=>`<button type="button" data-eb="${id}">${n}</button>`).join('');nav.querySelectorAll('[data-eb]').forEach(b=>b.onclick=()=>{nav.querySelectorAll('[data-eb]').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderEditorBlock(b.dataset.eb)});nav.querySelector('[data-eb="home"]').click()}async function renderEditorBlock(id){const name=blocks.find(x=>x[0]===id)[1],section=name==='На заказ'?'На заказ':name;const [t,m]=await Promise.all([db.from('site_content').select('*').eq('section',section).order('sort_order').order('id'),photoBlocks.has(id)?db.from('site_media').select('*').eq('section',name==='Жизнь студии'?'life_studio':section).order('sort_order').order('id'):Promise.resolve({data:[],error:null})]);if(t.error||m.error){$('editor-panel').textContent=(t.error||m.error).message;return}const texts=t.data||[],mediaRows=m.data||[];$('editor-panel').innerHTML=`<h3>${esc(name)}</h3><h4>Тексты</h4>${texts.length?texts.map(x=>`<div class="editor-item"><b>${esc(x.label||x.content_key)}</b><textarea data-et="${x.id}" rows="4">${esc(x.content||'')}</textarea><label><input type="checkbox" data-ev="${x.id}" ${x.is_visible!==false?'checked':''} style="width:auto"> Показывать</label><button data-es="${x.id}">Сохранить</button></div>`).join(''):'<p>Текстов нет.</p>'}${photoBlocks.has(id)?`<h4>Фотографии</h4>${mediaRows.length?mediaRows.map(x=>`<div class="editor-item"><b>${esc(x.label||x.slot_key)}</b><img src="${esc(media(x.image_url))}" alt=""><input type="file" accept="image/*" data-ef="${x.id}"><label><input type="checkbox" data-emv="${x.id}" ${x.is_visible!==false?'checked':''} style="width:auto"> Показывать</label><button data-ems="${x.id}">Сохранить фото</button></div>`).join(''):'<p>Фотографий нет.</p>'}`:''}`;document.querySelectorAll('[data-es]').forEach(b=>b.onclick=async()=>{const id=b.dataset.es,q=await db.from('site_content').update({content:$(`[data-et="${id}"]`).value,is_visible:$(`[data-ev="${id}"]`).checked,updated_at:new Date().toISOString()}).eq('id',id);if(q.error)alert(q.error.message);else renderEditorBlock(id)});document.querySelectorAll('[data-ems]').forEach(b=>b.onclick=async()=>{try{const id=b.dataset.ems,f=$(`[data-ef="${id}"]`).files[0],patch={is_visible:$(`[data-emv="${id}"]`).checked,updated_at:new Date().toISOString()};if(f)patch.image_url=await upload(f,'site-media');const q=await db.from('site_media').update(patch).eq('id',id);if(q.error)throw q.error;renderEditorBlock(id)}catch(x){alert(x.message||String(x))}})}init=async()=>{try{const s=await db.auth.getSession();if(s.data.session)await openApp(await admin())}catch(e){}};init()})();</script></body></html>
