[build]
  publish = "."

[build.processing]
  skip_processing = true

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/supabase/*"
  to = "/.netlify/functions/supabase-proxy/:splat"
  status = 200

[[redirects]]
  from = "/media/*"
  to = "/.netlify/functions/media-proxy/media/:splat"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin-panel.html"
  status = 200

[[redirects]]
  from = "/admin/"
  to = "/admin-panel.html"
  status = 200

[[redirects]]
  from = "/admin/editor"
  to = "/admin/site-editor/index.html"
  status = 200

[[redirects]]
  from = "/admin/editor/"
  to = "/admin/site-editor/index.html"
  status = 200
