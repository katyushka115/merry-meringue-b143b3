[build]
  command = "npm run build"
  publish = "."

[build.processing]
  skip_processing = true

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/supabase/*"
  to = "/.netlify/functions/supabase-proxy/:splat"
  status = 200

[[redirects]]
  from = "/media/*"
  to = "/.netlify/functions/media-proxy/media/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"
