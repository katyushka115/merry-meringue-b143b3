<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SM Flowers — Редактор сайта</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#f5f1eb;color:#20251f;font:14px/1.5 Arial}.wrap{max-width:1180px;margin:24px auto;padding:0 14px}.card{background:#fff;border:1px solid #e4ddd4;border-radius:16px;padding:20px;margin-bottom:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.btn,button{border:0;border-radius:9px;padding:10px 14px;background:#263125;color:#fff;cursor:pointer;text-decoration:none;display:inline-block}.back{background:#eee9e1;color:#222}.block{border:1px solid #ddd5ca;border-radius:12px;margin:10px 0;overflow:hidden}.block>button{width:100%;text-align:left;border-radius:0;background:#fff;color:#20251f;font-size:17px;font-weight:600;display:flex;justify-content:space-between}.block>button:after{content:'＋'}.block.open>button:after{content:'−'}.panel{display:none;padding:0 18px 18px}.block.open .panel{display:block}.row{border-top:1px solid #eee;padding:16px 0}.grid{display:grid;grid-template-columns:180px 1fr;gap:16px}.preview{width:180px;height:130px;object-fit:cover;border-radius:10px;background:#eee}textarea,input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #d8d2ca;border-radius:9px;margin:6px 0 10px}.muted{color:#687064}.actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:700px){.grid{grid-template-columns:1fr}.preview{width:100%}}</style></head><body><main class="wrap"><section id="login" class="card"><h1>SM Flowers — админка</h1><p>Вход администратора</p><form id="loginForm"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Пароль" required><button>Войти</button></form><p id="msg"></p></section><section id="app" class="hidden" style="display:none"><section class="card"><div class="top"><div><h1>Редактор сайта</h1><div id="user" class="muted"></div></div><div class="actions"><a class="btn back" href="/admin">← В админку</a><button id="logout" class="back">Выйти</button></div></div><p class="muted">Откройте нужный блок. Внутри находятся все тексты и фотографии этого блока.</p></section><section class="card" id="blocks"></section></section></main><script>(()=>{const db=supabase.createClient(location.origin+'/supabase','sb_publishable_3FgdTAmKB8kw2QTrrVPA5g_vb1lya1d',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}}),blocks=['Главная','О студии','Коллекции','На заказ','Букеты','Философия','Жизнь студии','Финальный блок','Контакты'],$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),mediaUrl=u=>{if(!u)return'';if(u.startsWith('/media/'))return u;try{const x=new URL(u),m='/storage/v1/object/public/bouquets/',i=x.pathname.indexOf(m);return i>=0?'/media/'+x.pathname.slice(i+m.length):u}catch{return u}};async function ensure(){const r=await db.rpc('is_admin');if(r.error||r.data!==true)throw new Error(r.error?.message||'Нет прав администратора');return(await db.auth.getUser()).data.user}async function section(name){const[t,m]=await Promise.all([db.from('site_content').select('*').eq('section',name).order('sort_order').order('id'),db.from('site_media').select('*').eq('section',name).order('sort_order').order('id')]);if(t.error)throw t.error;if(m.error)throw m.error;return{t:t.data||[],m:m.data||[]}}async function render(){const root=$('blocks');root.innerHTML='';for(const name of blocks){const el=document.createElement('div');el.className='block';el.innerHTML=`<button type="button">${esc(name)}</button><div class="panel"><div class="muted">Загрузка…</div></div>`;root.appendChild(el);el.querySelector('button').onclick=async()=>{if(el.classList.contains('open')){el.classList.remove('open');return}el.classList.add('open');const p=el.querySelector('.panel');try{const d=await section(name);p.innerHTML='<h3>Тексты</h3>'+(d.t.length?d.t.map(x=>`<div class="row"><b>${esc(x.label||x.content_key)}</b><div class="muted">${esc(x.content_key)}</div><textarea data-t="${x.id}" rows="4">${esc(x.content||'')}</textarea><label><input data-v="${x.id}" type="checkbox" ${x.is_visible!==false?'checked':''} style="width:auto"> Показывать</label><div class="actions"><button data-save="${x.id}">Сохранить текст</button></div></div>`).join(''):'<p class="muted">Нет текстовых полей.</p>')+'<h3>Фотографии</h3>'+(d.m.length?d.m.map(x=>`<div class="row grid"><img class="preview" src="${esc(mediaUrl(x.image_url))}" alt=""><div><b>${esc(x.label||x.slot_key)}</b><div class="muted">${esc(x.slot_key||'')}</div><input data-alt="${x.id}" value="${esc(x.alt_text||'')}" placeholder="Alt-текст"><input data-file="${x.id}" type="file" accept="image/*"><label><input data-mv="${x.id}" type="checkbox" ${x.is_visible!==false?'checked':''} style="width:auto"> Показывать</label><button data-msave="${x.id}">Сохранить фото</button></div></div>`).join(''):'<p class="muted">Нет фотографий.</p>';p.querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{const id=b.dataset.save,r=await db.from('site_content').update({content:p.querySelector(`[data-t="${id}"]`).value,is_visible:p.querySelector(`[data-v="${id}"]`).checked,updated_at:new Date().toISOString()}).eq('id',id);if(r.error)alert(r.error.message);else alert('Сохранено')});p.querySelectorAll('[data-msave]').forEach(b=>b.onclick=async()=>{try{const id=b.dataset.msave,f=p.querySelector(`[data-file="${id}"]`).files[0],patch={alt_text:p.querySelector(`[data-alt="${id}"]`).value,is_visible:p.querySelector(`[data-mv="${id}"]`).checked,updated_at:new Date().toISOString()};if(f){const ext=(f.name.split('.').pop()||'jpg').toLowerCase(),path='site-media/'+crypto.randomUUID()+'.'+ext,u=await db.storage.from('bouquets').upload(path,f,{upsert:false,contentType:f.type});if(u.error)throw u.error;patch.image_url='/media/'+path}const r=await db.from('site_media').update(patch).eq('id',id);if(r.error)throw r.error;alert('Сохранено')}catch(e){alert(e.message||e)}})}catch(e){p.innerHTML='<p>Ошибка: '+esc(e.message)+'</p>'}}}}async function init(){try{const s=await db.auth.getSession();if(s.data.session){const u=await ensure();$('user').textContent=u.email||'';$('login').style.display='none';$('app').style.display='block';await render()}}catch(e){}}$('loginForm').onsubmit=async e=>{e.preventDefault();try{const r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)throw r.error;const u=await ensure();$('user').textContent=u.email||'';$('login').style.display='none';$('app').style.display='block';await render()}catch(e){$('msg').textContent=e.message}};$('logout').onclick=async()=>{await db.auth.signOut();location.href='/admin'};init()})();</script></body></html>
