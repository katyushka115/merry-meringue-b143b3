<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SM Flowers — редактор сайта</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#f5f1eb;color:#20251f;font:14px/1.5 Arial,sans-serif}.wrap{max-width:1180px;margin:24px auto;padding:0 14px}.card{background:#fff;border:1px solid #e7e1d8;border-radius:18px;padding:20px;margin-bottom:18px}.hidden{display:none!important}h1,h2,h3{margin-top:0}label{display:block;font-weight:700;margin:10px 0 5px}input,textarea{width:100%;padding:10px;border:1px solid #d9d4cc;border-radius:10px;background:#fff;font:inherit}button{border:0;border-radius:10px;padding:10px 14px;background:#263125;color:#fff;cursor:pointer}.secondary{background:#eee9e1;color:#222}.danger{background:#a83d35}.row{display:grid;grid-template-columns:180px 1fr;gap:18px;align-items:start;border-top:1px solid #eee;padding:18px 0}.row:first-child{border-top:0}.preview{width:180px;height:140px;object-fit:cover;border-radius:12px;background:#eee}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.muted{color:#687064}.key{font:12px monospace;color:#687064;margin-top:2px}.msg{min-height:20px;margin-top:8px}.error{color:#b3261e}.success{color:#287a45}.block-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.block-tabs button{min-height:52px}.panel{margin-top:18px}@media(max-width:700px){.wrap{margin:12px auto;padding:0 10px}.card{padding:15px}.row{grid-template-columns:1fr}.preview{width:100%;height:220px}.actions button{width:100%}.block-tabs{grid-template-columns:1fr 1fr}}</style></head><body><div id="login" class="wrap card" style="max-width:460px;margin-top:12vh"><h1>SM Flowers</h1><p>Редактор сайта</p><form id="login-form"><label>Email</label><input id="email" type="email" required><label>Пароль</label><input id="password" type="password" required><button type="submit" style="margin-top:12px">Войти</button></form><div id="login-msg" class="msg"></div></div><main id="app" class="wrap hidden"><header class="card"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><div><h1>Редактор сайта</h1><div id="user-email" class="muted"></div></div><div class="actions"><button id="back" class="secondary">В админку</button><button id="logout" class="secondary">Выйти</button></div></div></header><section class="card"><h2>Блоки сайта</h2><p class="muted">Изменения сохраняются в Supabase и подхватываются публичным сайтом.</p><div id="block-tabs" class="block-tabs"></div></section><section id="panel" class="card panel"><h2 id="section-title"></h2><div id="texts"></div><div id="media"></div><div id="msg" class="msg"></div></section><section class="card"><h2>Добавить текст в текущий блок</h2><form id="add-form"><label>Название поля</label><input id="add-label" placeholder="Например: новая подпись"><label>Текст</label><textarea id="add-content" rows="4"></textarea><button style="margin-top:10px">Добавить</button></form><div id="add-msg" class="msg"></div></section></main><script>
(()=>{const URL='/supabase',KEY='sb_publishable_3FgdTAmKB8kw2QTrrVPA5g_vb1lya1d',BUCKET='bouquets';const db=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c]));const blocks=[['home','Главная'],['studio','О студии'],['collections','Коллекции'],['bouquets','Букеты'],['life','Жизнь студии'],['philosophy','Философия'],['contacts','Контакты']];const sectionMap=Object.fromEntries(blocks);let active='Главная',texts=[],media=[];function msg(id,t,e=false){$(id).textContent=t;$(id).className='msg '+(e?'error':'success')}async function admin(){const r=await db.rpc('is_admin');if(r.error||r.data!==true)throw new Error(r.error?.message||'Нет прав администратора');const u=await db.auth.getUser();if(u.error||!u.data.user)throw new Error('Сессия не найдена');return u.data.user}async function upload(f){const ext=(f.name.split('.').pop()||'jpg').toLowerCase(),path='site-media/'+crypto.randomUUID()+'.'+ext,r=await db.storage.from(BUCKET).upload(path,f,{upsert:false,contentType:f.type});if(r.error)throw r.error;return db.storage.from(BUCKET).getPublicUrl(path).data.publicUrl}async function load(){const[t,m]=await Promise.all([db.from('site_content').select('*').order('section').order('sort_order').order('id'),db.from('site_media').select('*').order('section').order('sort_order').order('id')]);if(t.error)throw t.error;if(m.error)throw m.error;texts=t.data||[];media=m.data||[];render()}function render(){const list=texts.filter(x=>x.section===active);$('section-title').textContent=active;$('texts').innerHTML='<h3>Тексты</h3>'+(list.length?list.map(t=>`<article class="row"><div><b>${esc(t.label||'Без названия')}</b><div class="key">${esc(t.content_key)}</div></div><div><textarea class="tx" data-id="${t.id}" rows="4">${esc(t.content||'')}</textarea><label><input class="vis" data-id="${t.id}" type="checkbox" style="width:auto" ${t.is_visible!==false?'checked':''}> Показывать на сайте</label><div class="actions"><button class="save" data-id="${t.id}">Сохранить</button><button class="danger del" data-id="${t.id}">Удалить</button></div></div></article>`).join(''):'<p class="muted">В этом блоке пока нет текстов.</p>');const ms=media.filter(x=>x.section===active);$('media').innerHTML=ms.length?'<h3 style="margin-top:28px">Фотографии</h3>'+ms.map(m=>`<article class="row"><div><img class="preview" loading="lazy" src="${esc(m.image_url||'')}" alt="${esc(m.alt_text||m.label)}"></div><div><b>${esc(m.label)}</b><div class="key">${esc(m.slot_key)}</div><label>Alt-текст</label><input class="alt" data-id="${m.id}" value="${esc(m.alt_text||'')}"><label>Загрузить новую фотографию</label><input class="file" data-id="${m.id}" type="file" accept="image/jpeg,image/png,image/webp"><label><input class="mvis" data-id="${m.id}" type="checkbox" style="width:auto" ${m.is_visible!==false?'checked':''}> Показывать на сайте</label><div class="actions"><button class="msave" data-id="${m.id}">Сохранить фото</button></div></div></article>`).join(''):'<p class="muted">В этом блоке пока нет фотографий.</p>';bind()}function renderBlocks(){$('block-tabs').innerHTML=blocks.map(([id,title])=>`<button class="${sectionMap[id]===active?'':'secondary'}" data-block="${id}">${title}</button>`).join('');document.querySelectorAll('[data-block]').forEach(b=>b.onclick=()=>{active=sectionMap[b.dataset.block];renderBlocks();render()})}function bind(){document.querySelectorAll('.save').forEach(b=>b.onclick=async()=>{try{b.disabled=true;const id=b.dataset.id,c=document.querySelector(`.tx[data-id="${id}"]`).value,v=document.querySelector(`.vis[data-id="${id}"]`).checked,r=await db.from('site_content').update({content:c,is_visible:v,updated_at:new Date().toISOString()}).eq('id',id);if(r.error)throw r.error;msg('msg','Текст сохранён.');await load()}catch(e){msg('msg',e.message,true)}finally{b.disabled=false}});document.querySelectorAll('.del').forEach(b=>b.onclick=async()=>{if(!confirm('Удалить этот текст?'))return;const r=await db.from('site_content').delete().eq('id',b.dataset.id);if(r.error)msg('msg',r.error.message,true);else await load()});document.querySelectorAll('.msave').forEach(b=>b.onclick=async()=>{try{b.disabled=true;const id=b.dataset.id,f=document.querySelector(`.file[data-id="${id}"]`).files[0],alt=document.querySelector(`.alt[data-id="${id}"]`).value.trim(),visible=document.querySelector(`.mvis[data-id="${id}"]`).checked,patch={alt_text:alt,is_visible:visible,updated_at:new Date().toISOString()};if(f)patch.image_url=await upload(f);const r=await db.from('site_media').update(patch).eq('id',id);if(r.error)throw r.error;msg('msg','Фотография сохранена.');await load()}catch(e){msg('msg',e.message,true)}finally{b.disabled=false}})}$('add-form').onsubmit=async e=>{e.preventDefault();try{const label=$('add-label').value.trim(),content=$('add-content').value;if(!label)throw new Error('Укажите название');const key=active.toLowerCase().replace(/[^a-zа-я0-9]+/gi,'_')+'_'+crypto.randomUUID().slice(0,8),r=await db.from('site_content').insert({section:active,label,content,content_key:key,sort_order:900,is_visible:true});if(r.error)throw r.error;$('add-label').value='';$('add-content').value='';msg('add-msg','Текст добавлен.');await load()}catch(e){msg('add-msg',e.message,true)}}$('login-form').onsubmit=async e=>{e.preventDefault();try{const r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)throw r.error;const u=await admin();$('user-email').textContent=u.email||'';$('login').classList.add('hidden');$('app').classList.remove('hidden');renderBlocks();await load()}catch(e){msg('login-msg',e.message,true)}}$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};$('back').onclick=()=>location.href='/admin/';window.addEventListener('load',async()=>{try{const s=await db.auth.getSession();if(s.data.session){const u=await admin();$('user-email').textContent=u.email||'';$('login').classList.add('hidden');$('app').classList.remove('hidden');renderBlocks();await load()}}catch(e){}})})();
</script></body></html>
