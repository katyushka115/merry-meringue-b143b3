<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SM Flowers — редактор сайта</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><div id="login"><h1>SM Flowers</h1><form id="login-form"><input id="email" type="email" required><input id="password" type="password" required><button>Войти</button></form><div id="login-msg"></div></div><main id="app" hidden><h1>Редактор сайта</h1><div id="user-email"></div><button id="logout">Выйти</button><div id="block-tabs"></div><section><h2 id="section-title"></h2><div id="texts"></div><div id="media"></div><div id="msg"></div></section><section><h2>Добавить текст</h2><form id="add-form"><input id="add-label" placeholder="Название поля" required><textarea id="add-content"></textarea><button>Добавить</button></form><div id="add-msg"></div></section></main><script>(()=>{const URL=location.origin+'/supabase',KEY='sb_publishable_3FgdTAmKB8kw2QTrrVPA5g_vb1lya1d',BUCKET='bouquets';const db=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});const $=id=>document.getElementById(id);const blocks=['Главная','О студии','Коллекции','Букеты','Жизнь студии','Философия','Контакты'];let active='Главная';async function admin(){const r=await db.rpc('is_admin');if(r.error||r.data!==true)throw new Error(r.error?.message||'Нет прав администратора');return (await db.auth.getUser()).data.user}async function load(){const[t,m]=await Promise.all([db.from('site_content').select('*').eq('section',active).order('sort_order').order('id'),db.from('site_media').select('*').eq('section',active).order('sort_order').order('id')]);if(t.error)throw t.error;if(m.error)throw m.error;render(t.data||[],m.data||[])}function render(ts,ms){$('section-title').textContent=active;$('texts').innerHTML=ts.map(t=>`<div><b>${t.label||t.content_key}</b><textarea data-t="${t.id}">${t.content||''}</textarea><label><input type="checkbox" data-v="${t.id}" ${t.is_visible!==false?'checked':''}> Видно</label><button data-save="${t.id}">Сохранить</button></div>`).join('');$('media').innerHTML=ms.map(m=>`<div><img src="${m.image_url||''}" style="max-width:240px;max-height:180px"><b>${m.label||m.slot_key}</b><input type="file" accept="image/jpeg,image/png,image/webp" data-f="${m.id}"><input data-a="${m.id}" value="${m.alt_text||''}"><button data-msave="${m.id}">Сохранить фото</button></div>`).join('');document.querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{const id=b.dataset.save,r=await db.from('site_content').update({content:document.querySelector(`[data-t="${id}"]`).value,is_visible:document.querySelector(`[data-v="${id}"]`).checked,updated_at:new Date().toISOString()}).eq('id',id);if(r.error)alert(r.error.message);else load()});document.querySelectorAll('[data-msave]').forEach(b=>b.onclick=async()=>{const id=b.dataset.msave,f=document.querySelector(`[data-f="${id}"]`).files[0],patch={alt_text:document.querySelector(`[data-a="${id}"]`).value,updated_at:new Date().toISOString()};if(f){const ext=(f.name.split('.').pop()||'jpg').toLowerCase(),path='site-media/'+crypto.randomUUID()+'.'+ext,u=await db.storage.from(BUCKET).upload(path,f,{upsert:false,contentType:f.type});if(u.error)return alert(u.error.message);patch.image_url=db.storage.from(BUCKET).getPublicUrl(path).data.publicUrl}const r=await db.from('site_media').update(patch).eq('id',id);if(r.error)alert(r.error.message);else load()})}function tabs(){ $('block-tabs').innerHTML=blocks.map(x=>`<button data-b="${x}">${x}</button>`).join('');document.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{active=b.dataset.b;load()})}$('login-form').onsubmit=async e=>{e.preventDefault();try{const r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)throw r.error;const u=await admin();$('user-email').textContent=u.email||'';$('login').hidden=true;$('app').hidden=false;tabs();await load()}catch(e){$('login-msg').textContent=e.message}};$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};window.addEventListener('load',async()=>{try{const s=await db.auth.getSession();if(s.data.session){const u=await admin();$('user-email').textContent=u.email||'';$('login').hidden=true;$('app').hidden=false;tabs();await load()}}catch(e){}})})();</script></body></html>
