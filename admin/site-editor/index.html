<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SM Flowers — редактор сайта</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#f5f1eb;color:#20251f;font:14px/1.5 Arial}.wrap{max-width:1180px;margin:24px auto;padding:0 14px}.card{background:#fff;border:1px solid #e4ddd4;border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 5px 20px #00000008}button{border:0;border-radius:10px;padding:11px 15px;background:#263125;color:#fff;cursor:pointer}.secondary{background:#eee9e1;color:#222}.blocks{display:grid;gap:10px}.block{border:1px solid #e2dbd2;border-radius:14px;overflow:hidden;background:#fff}.block>button{width:100%;display:flex;align-items:center;justify-content:space-between;text-align:left;border-radius:0;background:#fff;color:#20251f;padding:16px 18px;font-size:15px;font-weight:700}.block>button span{display:flex;gap:12px;align-items:center}.num{display:inline-flex;width:30px;height:30px;border-radius:9px;align-items:center;justify-content:center;background:#f1ece5;font-size:13px}.chev{font-size:18px;color:#687064}.panel{display:none;padding:0 18px 20px;border-top:1px solid #eee9e1}.block.open .panel{display:block}.row{display:grid;grid-template-columns:190px 1fr;gap:18px;border-top:1px solid #eee;padding:18px 0}.preview{width:190px;height:145px;object-fit:cover;border-radius:10px;background:#eee}textarea,input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #d8d2ca;border-radius:9px;margin:6px 0 10px}.actions{display:flex;gap:8px;flex-wrap:wrap}.muted{color:#687064}.hidden{display:none}.section-title{margin:20px 0 4px;font-size:18px}.hint{margin:0 0 14px;color:#687064}@media(max-width:700px){.row{grid-template-columns:1fr}.preview{width:100%}}</style></head><body><div id="login" class="wrap card"><h1>SM Flowers — редактор сайта</h1><p>Вход администратора</p><form id="login-form"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Пароль" required><button>Войти</button></form><p id="login-msg"></p></div><main id="app" class="wrap hidden"><header class="card"><div class="actions" style="justify-content:space-between"><div><h1>Редактор сайта</h1><div class="muted">Блоки расположены в том же порядке, что и на сайте</div><div id="user-email" class="muted"></div></div><button id="logout" class="secondary">Выйти</button></div></header><section class="card"><div id="blocks" class="blocks"></div></section><section id="editor" class="card hidden"><h2 id="title"></h2><p class="hint">Редактируй текст и фотографии этого блока, затем сохраняй изменения.</p><div id="texts"></div><div id="media"></div><section><h3 class="section-title">Добавить текст</h3><form id="add-form"><input id="add-label" placeholder="Название поля" required><textarea id="add-content" rows="4" placeholder="Текст"></textarea><button>Добавить</button></form></section><div id="status"></div></section></main><script>(()=>{const URL=location.origin+'/supabase',KEY='sb_publishable_3FgdTAmKB8kw2QTrrVPA5g_vb1lya1d',BUCKET='bouquets';const db=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}}),$=id=>document.getElementById(id);const blocks=[['Главный экран','🏠'],['Навигация','🧭'],['О студии','✨'],['Коллекции','🌸'],['На заказ','💐'],['Букеты','🌷'],['Философия','🤍'],['Жизнь студии','📸'],['Финальный блок','✨'],['Контакты','📍']];const dbSection={'Главный экран':'Главная','Навигация':'Навигация','О студии':'О студии','Коллекции':'Коллекции','На заказ':'На заказ','Букеты':'Букеты','Философия':'Философия','Жизнь студии':'Жизнь студии','Финальный блок':'Финальный блок','Контакты':'Контакты'};let active=null;const mediaUrl=u=>{if(!u)return'';if(u.startsWith('/media/'))return u;try{const x=new URL(u);const marker='/storage/v1/object/public/'+BUCKET+'/';const i=x.pathname.indexOf(marker);return i>=0?'/media/'+x.pathname.slice(i+marker.length):u}catch{return u}};async function ensure(){const a=await db.rpc('is_admin');if(a.error||a.data!==true)throw new Error(a.error?.message||'Нет прав администратора');return(await db.auth.getUser()).data.user}function renderBlocks(){ $('blocks').innerHTML=blocks.map(([name,icon],i)=>`<div class="block" data-block="${name}"><button type="button"><span><b class="num">${String(i+1).padStart(2,'0')}</b><span>${icon} ${name}</span></span><span class="chev">›</span></button><div class="panel"></div></div>`).join('');document.querySelectorAll('.block>button').forEach(b=>b.onclick=async()=>{const box=b.parentElement;if(box.classList.contains('open')){box.classList.remove('open');active=null;return}document.querySelectorAll('.block.open').forEach(x=>x.classList.remove('open'));box.classList.add('open');active=box.dataset.block;await load()})}async function load(){const section=dbSection[active];$('title').textContent=(blocks.find(x=>x[0]===active)||[''])[1]+' '+active;const[t,m]=await Promise.all([db.from('site_content').select('*').eq('section',section).order('sort_order').order('id'),db.from('site_media').select('*').eq('section',section).order('sort_order').order('id')]);if(t.error)throw t.error;if(m.error)throw m.error;$('editor').classList.remove('hidden');$('texts').innerHTML='<h3 class="section-title">Тексты</h3>'+(t.data||[]).map(x=>`<div class="row"><div><b>${x.label||x.content_key}</b><div class="muted">${x.content_key}</div></div><div><textarea data-t="${x.id}" rows="4">${x.content||''}</textarea><label><input data-v="${x.id}" type="checkbox" ${x.is_visible!==false?'checked':''} style="width:auto"> Показывать</label><div class="actions"><button data-save="${x.id}">Сохранить</button><button class="secondary" data-del="${x.id}">Удалить</button></div></div></div>`).join('')||'<p class="muted">Текстов в этом разделе пока нет.</p>';$('media').innerHTML='<h3 class="section-title">Фотографии</h3>'+(m.data||[]).map(x=>`<div class="row"><div><img class="preview" src="${mediaUrl(x.image_url)}" alt="${x.alt_text||''}"></div><div><b>${x.label||x.slot_key}</b><input data-alt="${x.id}" value="${x.alt_text||''}" placeholder="Alt-текст"><input data-file="${x.id}" type="file" accept="image/jpeg,image/png,image/webp"><label><input data-mv="${x.id}" type="checkbox" ${x.is_visible!==false?'checked':''} style="width:auto"> Показывать</label><button data-msave="${x.id}">Сохранить фото</button></div></div>`).join('')||'<p class="muted">Фотографий в этом разделе пока нет.</p>';bind()}function bind(){document.querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{const id=b.dataset.save,r=await db.from('site_content').update({content:document.querySelector(`[data-t="${id}"]`).value,is_visible:document.querySelector(`[data-v="${id}"]`).checked,updated_at:new Date().toISOString()}).eq('id',id);if(r.error)return alert(r.error.message);await load()});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('Удалить текст?'))return;const r=await db.from('site_content').delete().eq('id',b.dataset.del);if(r.error)alert(r.error.message);else load()});document.querySelectorAll('[data-msave]').forEach(b=>b.onclick=async()=>{try{const id=b.dataset.msave,f=document.querySelector(`[data-file="${id}"]`).files[0],patch={alt_text:document.querySelector(`[data-alt="${id}"]`).value,is_visible:document.querySelector(`[data-mv="${id}"]`).checked,updated_at:new Date().toISOString()};if(f){const ext=(f.name.split('.').pop()||'jpg').toLowerCase(),path='site-media/'+crypto.randomUUID()+'.'+ext,u=await db.storage.from(BUCKET).upload(path,f,{upsert:false,contentType:f.type});if(u.error)throw u.error;patch.image_url='/media/'+path}const r=await db.from('site_media').update(patch).eq('id',id);if(r.error)throw r.error;await load()}catch(e){alert(e.message||e)}})}$('add-form').onsubmit=async e=>{e.preventDefault();const label=$('add-label').value.trim(),content=$('add-content').value;if(!label)return;const section=dbSection[active],r=await db.from('site_content').insert({section,label,content,content_key:section.toLowerCase().replace(/[^a-zа-я0-9]+/gi,'_')+'_'+crypto.randomUUID().slice(0,8),sort_order:900,is_visible:true});if(r.error)return alert(r.error.message);$('add-label').value='';$('add-content').value='';load()};$('login-form').onsubmit=async e=>{e.preventDefault();try{const r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)throw r.error;const u=await ensure();$('user-email').textContent=u.email||'';$('login').classList.add('hidden');$('app').classList.remove('hidden');renderBlocks()}catch(e){$('login-msg').textContent=e.message}};$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};window.addEventListener('load',async()=>{try{const s=await db.auth.getSession();if(s.data.session){const u=await ensure();$('user-email').textContent=u.email||'';$('login').classList.add('hidden');$('app').classList.remove('hidden');renderBlocks()}}catch(e){}})})();</script></body></html>
