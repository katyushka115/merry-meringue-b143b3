<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SM Flowers — админка</title><style>html,body{margin:0;height:100%;background:#f5f1eb}#adminFrame{display:block;width:100%;height:100vh;border:0}</style></head><body><iframe id="adminFrame" src="../admin-panel.html" title="SM Flowers — админка"></iframe><script>
(function(){
const frame=document.getElementById('adminFrame');
const DB_URL='https://avlozhwwvjqiypifoxox.supabase.co',KEY='sb_publishable_3FgdTAmKB8kw2QTrrVPA5g_vb1lya1d',BUCKET='bouquets';
const labels={'Главная':'Главная','О студии':'О студии','Коллекции':'Выберите настроение (коллекции)','На заказ':'Ваша идея','Букеты':'Букеты недели','Философия':'Почему SM Flowers','Жизнь студии':'Жизнь студии','Финальный блок':'Финальный блок','Контакты':'Контакты','Навигация':'Навигация'};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function media(u){if(!u)return '';const v=String(u);if(v.startsWith('/media/'))return DB_URL+'/storage/v1/render/image/public/'+BUCKET+'/'+v.slice(7);try{const x=new URL(v),n='/storage/v1/object/public/'+BUCKET+'/',i=x.pathname.indexOf(n);return i>=0?DB_URL+'/storage/v1/render/image/public/'+BUCKET+'/'+x.pathname.slice(i+n.length):v}catch{return v}}
function db(){const s=frame.contentWindow.supabase;return s&&s.createClient?s.createClient(DB_URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}}):null}
function inject(){try{const doc=frame.contentDocument;if(!doc)return;const style=doc.createElement('style');style.textContent='.site-grid{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:12px!important}.site-tile{cursor:pointer!important;pointer-events:auto!important}@media(max-width:800px){.site-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px!important}}@media(max-width:520px){.site-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:7px!important}.site-tile{min-height:70px!important;padding:8px!important;font-size:11px!important}}';doc.head.appendChild(style);const grid=doc.getElementById('siteGrid');if(!grid||grid.dataset.fixed==='2')return;grid.dataset.fixed='2';grid.addEventListener('click',function(e){const tile=e.target.closest('[data-block]');if(!tile)return;e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();open(tile.dataset.block,doc)},true)}catch(e){console.error('SM admin',e)}}
async function open(section,doc){const client=db();if(!client)return alert('Не удалось подключиться к Supabase');const box=doc.getElementById('siteEditor');if(!box)return;box.classList.remove('hidden');box.innerHTML='<p class="muted">Загрузка…</p>';try{
const [t,m]=await Promise.all([client.from('site_content').select('*').order('sort_order').order('id'),client.from('site_media').select('*').order('sort_order').order('id')]);if(t.error)throw t.error;if(m.error)throw m.error;
const ts=(t.data||[]).filter(x=>x.section===section),ms=(m.data||[]).filter(x=>x.section===section);
let html='<div class="actions"><h3>'+esc(labels[section]||section)+'</h3><button type="button" class="secondary" id="fixedClose">Закрыть</button></div><p class="muted">Изменения сохраняются напрямую в Supabase.</p>';
if(section==='Букеты'){
 const p=await client.from('products').select('*').order('sort_order').order('id');if(p.error)throw p.error;
 html+='<h4>Букеты недели</h4><p class="muted">Здесь отображаются все активные букеты из каталога — сейчас '+(p.data||[]).length+'. Управление букетами остаётся в разделе «Букеты».</p>'+(p.data||[]).map(x=>'<div class="field photo"><img src="'+esc(media(x.image_url))+'" alt="'+esc(x.name)+'"><div><b>'+esc(x.name)+'</b><br>'+Number(x.price||0).toLocaleString('ru-RU')+' ₽<br><span class="muted">'+esc(x.description||'')+'</span><br><label><input type="checkbox" disabled '+(x.is_active!==false?'checked':'')+' style="width:auto"> Показывается</label></div></div>').join('')||'<p class="muted">Букетов нет.</p>';
}else{
 html+='<h4>Тексты</h4>'+(ts.length?ts.map(x=>'<div class="field"><div class="field-head"><b>'+esc(x.label||x.content_key)+'</b><span class="muted">'+esc(x.content_key)+'</span></div><textarea data-fixed-text="'+x.id+'" rows="4">'+esc(x.content||'')+'</textarea><label><input type="checkbox" data-fixed-vis="'+x.id+'" '+(x.is_visible!==false?'checked':'')+' style="width:auto"> Показывать</label><br><button type="button" data-fixed-save="'+x.id+'">Сохранить</button></div>').join(''):'<p class="muted">Текстов пока нет.</p>')+'<h4>Фотографии</h4>'+(ms.length?ms.map(x=>'<div class="field photo"><img src="'+esc(media(x.image_url))+'" alt="'+esc(x.alt_text||'')+'"><div style="flex:1;min-width:240px"><b>'+esc(x.label||x.slot_key)+'</b><input data-fixed-alt="'+x.id+'" value="'+esc(x.alt_text||'')+'" placeholder="Alt-текст"><input type="file" accept="image/*" data-fixed-file="'+x.id+'"><label><input type="checkbox" data-fixed-mvis="'+x.id+'" '+(x.is_visible!==false?'checked':'')+' style="width:auto"> Показывать</label><br><button type="button" data-fixed-msave="'+x.id+'">Сохранить фото</button></div></div>').join(''):'<p class="muted">Фотографий пока нет.</p>')+'<div class="field"><b>Добавить фотографию</b><input id="fixedPhotoLabel" placeholder="Название фотографии"><input id="fixedPhotoFile" type="file" accept="image/*"><button type="button" id="fixedAddPhoto">Добавить фото</button></div>';
}
box.innerHTML=html;box.querySelector('#fixedClose').onclick=()=>{box.classList.add('hidden');box.innerHTML=''};
box.querySelectorAll('[data-fixed-save]').forEach(b=>b.onclick=async()=>{const id=b.dataset.fixedSave,r=await client.from('site_content').update({content:box.querySelector('[data-fixed-text="'+id+'"]').value,is_visible:box.querySelector('[data-fixed-vis="'+id+'"]').checked,updated_at:new Date().toISOString()}).eq('id',id);if(r.error)alert(r.error.message);else b.textContent='Сохранено'});
box.querySelectorAll('[data-fixed-msave]').forEach(b=>b.onclick=async()=>{try{const id=b.dataset.fixedMsave,f=box.querySelector('[data-fixed-file="'+id+'"]').files[0],patch={alt_text:box.querySelector('[data-fixed-alt="'+id+'"]').value,is_visible:box.querySelector('[data-fixed-mvis="'+id+'"]').checked,updated_at:new Date().toISOString()};if(f){const ext=(f.name.split('.').pop()||'jpg').toLowerCase(),path='site-media/'+crypto.randomUUID()+'.'+ext,r=await client.storage.from(BUCKET).upload(path,f,{contentType:f.type,upsert:false});if(r.error)throw r.error;patch.image_url=DB_URL+'/storage/v1/render/image/public/'+BUCKET+'/'+path}const r=await client.from('site_media').update(patch).eq('id',id);if(r.error)throw r.error;b.textContent='Сохранено'}catch(e){alert(e.message)}});
const add=box.querySelector('#fixedAddPhoto');if(add)add.onclick=async()=>{try{const f=box.querySelector('#fixedPhotoFile').files[0];if(!f)return alert('Выберите фото');const q=await client.from('site_media').select('sort_order').eq('section',section).order('sort_order',{ascending:false}).limit(1).maybeSingle();const ext=(f.name.split('.').pop()||'jpg').toLowerCase(),path='site-media/'+crypto.randomUUID()+'.'+ext,u=await client.storage.from(BUCKET).upload(path,f,{contentType:f.type,upsert:false});if(u.error)throw u.error;const url=DB_URL+'/storage/v1/render/image/public/'+BUCKET+'/'+path,r=await client.from('site_media').insert({section,slot_key:'extra-'+crypto.randomUUID(),label:box.querySelector('#fixedPhotoLabel').value.trim()||'Новая фотография',image_url:url,sort_order:Number(q.data?.sort_order||0)+1,is_visible:true});if(r.error)throw r.error;await open(section,doc)}catch(e){alert(e.message)}};
}catch(e){box.innerHTML='<p style="color:#a83d35">Не удалось загрузить блок: '+esc(e.message)+'</p>'}}
frame.addEventListener('load',function(){inject();setTimeout(inject,300);setTimeout(inject,1200)});setInterval(inject,1500);
})();</script></body></html>
