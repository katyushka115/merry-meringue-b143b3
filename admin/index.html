<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>SM Flowers — Админка</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#f5f1eb;color:#20251f;font:14px/1.5 Arial,sans-serif}.wrap{max-width:1100px;margin:40px auto;padding:0 16px}.card{background:#fff;border:1px solid #e7e1d8;border-radius:18px;padding:24px}.login{max-width:460px;margin:12vh auto}.hidden{display:none!important}label{display:block;font-weight:700;margin:14px 0 6px}input,textarea,select{width:100%;padding:11px;border:1px solid #d9d4cc;border-radius:10px}button{border:0;border-radius:10px;padding:11px 16px;background:#263125;color:#fff;cursor:pointer}.secondary{background:#eee9e1;color:#222}.danger{background:#a83d35}.msg{margin-top:12px;min-height:22px}.error{color:#b3261e}.success{color:#287a45}.tabs{display:flex;gap:8px;margin:20px 0;flex-wrap:wrap}.tab.active{background:#263125;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.product{display:grid;grid-template-columns:80px 1fr auto;gap:12px;align-items:center;border-top:1px solid #eee;padding:12px 0}.product img{width:80px;height:80px;object-fit:cover;border-radius:10px}.actions{display:flex;gap:8px;flex-wrap:wrap}.order{margin:12px 0;padding:20px;border:1px solid #e7e1d8;border-radius:14px;background:#fff}.order-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}.order-title{font-size:18px}.order-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 24px;margin-top:16px}.order-field{padding:8px 0;border-top:1px solid #eee}.order-field b{display:block;margin-bottom:3px;color:#5c625a}.order-items{margin-top:16px;padding-top:12px;border-top:1px solid #eee}.status{display:inline-block;padding:5px 9px;border-radius:999px;background:#eee9e1}.muted{color:#686d67}@media(max-width:760px){.grid{grid-template-columns:1fr}.product{grid-template-columns:65px 1fr}.product .actions{grid-column:2}.product img{width:65px;height:65px}.order-grid{grid-template-columns:1fr}}</style></head><body>
<div id="login" class="wrap login card"><h1>SM Flowers</h1><p>Вход в панель управления</p><form id="login-form"><label>Email</label><input id="email" type="email" autocomplete="username" required><label>Пароль</label><input id="password" type="password" autocomplete="current-password" required><button id="login-button" type="submit" style="margin-top:16px">Войти</button></form><div id="login-msg" class="msg"></div><div id="boot" class="boot hidden"></div></div>
<div id="app" class="wrap hidden"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><div><h1>SM Flowers — админка</h1><div id="user-email"></div></div><button id="logout" class="secondary">Выйти</button></div><div class="tabs"><button class="tab active" data-tab="products">Букеты</button><button class="tab" data-tab="orders">Заказы</button><button class="tab" data-tab="settings">Настройки</button></div>
<section id="products-tab"><div class="grid"><div class="card"><h2>Каталог</h2><div id="products"></div></div><div class="card"><h2>Новый / изменить букет</h2><form id="product-form"><input id="pid" type="hidden"><label>Название</label><input id="pname" required><label>Цена</label><input id="pprice" type="number" min="0" step="0.01" required><label>Описание</label><textarea id="pdesc"></textarea><label>Фото</label><input id="pimage" type="file" accept="image/jpeg,image/png,image/webp"><label>Категория</label><select id="pcat"><option value="">Без категории</option></select><p><label style="font-weight:400"><input id="pactive" type="checkbox" checked style="width:auto"> Активен на сайте</label><label style="font-weight:400"><input id="pfeatured" type="checkbox" style="width:auto"> Избранный</label></p><div class="actions"><button>Сохранить</button><button id="clear" type="button" class="secondary">Очистить</button></div></form><div id="product-msg" class="msg"></div></div></div></section>
<section id="orders-tab" class="hidden card"><h2>Заказы</h2><div id="orders"></div></section>
<section id="settings-tab" class="hidden card"><h2>Настройки магазина</h2><form id="settings-form"><label>Название</label><input id="sname"><label>Телефон</label><input id="sphone"><label>Telegram</label><input id="stelegram" value="https://t.me/smflowersmsk"><label>Instagram</label><input id="sinstagram" value="https://www.instagram.com/smflowers.msk?igsh=enFqZGtuaW1qNWRi&utm_source=qr"><button style="margin-top:16px">Сохранить</button></form><div id="settings-msg" class="msg"></div></section></div>
<script>
(()=>{const URL='https://avlozhwwvjqiypifoxox.supabase.co',KEY='sb_publishable_3FgdTAmKB8kw2QTrrVPA5g_vb1lya1d';const $=id=>document.getElementById(id);const boot=t=>{$('boot').textContent=t;$('boot').classList.remove('hidden')};window.addEventListener('error',e=>boot('Ошибка JavaScript: '+e.message));window.addEventListener('unhandledrejection',e=>boot('Ошибка: '+(e.reason?.message||String(e.reason))));if(!window.supabase?.createClient){boot('Не загрузилась библиотека Supabase. Проверь интернет/блокировщик и обнови страницу.');return}const db=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});const setmsg=(id,t,err)=>{$(id).textContent=t;$(id).className='msg '+(err?'error':'success')};const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
async function admin(){const {data,error}=await db.rpc('is_admin');if(error)throw new Error('Проверка администратора: '+error.message);if(data!==true)throw new Error('Этот аккаунт не имеет прав администратора.');const {data:{user},error:ue}=await db.auth.getUser();if(ue||!user)throw new Error(ue?.message||'Сессия не найдена.');return user}
async function openApp(user){$('user-email').textContent=user.email||'';$('login').classList.add('hidden');$('app').classList.remove('hidden');await Promise.allSettled([loadProducts(),loadCategories(),loadOrders(),loadSettings()])}
$('login-form').onsubmit=async e=>{e.preventDefault();$('login-button').disabled=true;setmsg('login-msg','Выполняем вход…');try{const {data,error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw new Error('Supabase: '+error.message);if(!data.session)throw new Error('Supabase не создал сессию.');await openApp(await admin());setmsg('login-msg','')}catch(x){console.error(x);setmsg('login-msg',x.message||String(x),true)}finally{$('login-button').disabled=false}};
$('logout').onclick=async()=>{await db.auth.signOut();$('app').classList.add('hidden');$('login').classList.remove('hidden');$('password').value=''};
window.addEventListener('load',async()=>{try{const {data}=await db.auth.getSession();if(data.session)await openApp(await admin())}catch(x){setmsg('login-msg',x.message||String(x),true)}});
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');['products','orders','settings'].forEach(x=>$(x+'-tab').classList.toggle('hidden',x!==b.dataset.tab))});
async function loadCategories(){const {data,error}=await db.from('categories').select('id,name').eq('is_active',true).order('sort_order');if(!error)$('pcat').innerHTML='<option value="">Без категории</option>'+(data||[]).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}
async function loadProducts(){const {data,error}=await db.from('products').select('*').order('sort_order').order('id');if(error){setmsg('product-msg',error.message,true);return}$('products').innerHTML=(data||[]).map(p=>`<div class="product"><img src="${esc(p.image_url||'assets/bouquet-6.svg')}"><div><b>${esc(p.name)}</b><div>${Number(p.price).toLocaleString('ru-RU')} ₽</div><small>${p.is_active?'Активен':'Скрыт'}${p.is_featured?' · Избранный':''}</small></div><div class="actions"><button class="secondary edit" data-id="${p.id}">Изменить</button><button class="danger del" data-id="${p.id}">Удалить</button></div></div>`).join('')||'<p>Каталог пуст.</p>';document.querySelectorAll('.edit').forEach(b=>b.onclick=()=>edit((data||[]).find(p=>String(p.id)===b.dataset.id)));document.querySelectorAll('.del').forEach(b=>b.onclick=async()=>{if(confirm('Удалить букет?')){const r=await db.from('products').delete().eq('id',b.dataset.id);if(r.error)setmsg('product-msg',r.error.message,true);else loadProducts()}})}
function edit(p){$('pid').value=p.id;$('pname').value=p.name;$('pprice').value=p.price;$('pdesc').value=p.description||'';$('pcat').value=p.category_id||'';$('pactive').checked=p.is_active!==false;$('pfeatured').checked=!!p.is_featured;window.scrollTo({top:0,behavior:'smooth'})}function clear(){ $('product-form').reset();$('pid').value='';$('pactive').checked=true }$('clear').onclick=clear;
$('product-form').onsubmit=async e=>{e.preventDefault();try{setmsg('product-msg','Сохраняем…');const id=$('pid').value;let image=null;if(id){const old=await db.from('products').select('image_url').eq('id',id).single();if(old.error)throw old.error;image=old.data.image_url}const f=$('pimage').files[0];if(f){const ext=(f.name.split('.').pop()||'jpg').toLowerCase(),path=crypto.randomUUID()+'.'+ext;const u=await db.storage.from('bouquets').upload(path,f,{upsert:false,contentType:f.type});if(u.error)throw u.error;image=db.storage.from('bouquets').getPublicUrl(path).data.publicUrl}const name=$('pname').value.trim(),payload={name,slug:name.toLowerCase().replace(/[^a-zа-я0-9]+/gi,'-').replace(/^-|-$/g,''),price:Number($('pprice').value),description:$('pdesc').value.trim()||null,image_url:image,category_id:$('pcat').value?Number($('pcat').value):null,is_active:$('pactive').checked,is_featured:$('pfeatured').checked};const r=id?await db.from('products').update(payload).eq('id',id):await db.from('products').insert(payload);if(r.error)throw r.error;clear();setmsg('product-msg','Букет сохранён.');loadProducts()}catch(x){setmsg('product-msg',x.message||String(x),true)}};
async function loadOrders(){const {data,error}=await db.from('orders').select('id,status,total_amount,delivery_address,delivery_date,delivery_time,created_at,customers(name,phone,email),order_items(product_name,quantity,unit_price,line_total)').order('created_at',{ascending:false});if(error){$('orders').textContent=error.message;return}$('orders').innerHTML=(data||[]).map(o=>{const created=o.created_at?new Date(o.created_at).toLocaleString('ru-RU',{dateStyle:'short',timeStyle:'short'}):'—';const deliveryDate=o.delivery_date?new Date(o.delivery_date+'T00:00:00').toLocaleDateString('ru-RU'):'';const delivery=deliveryDate||o.delivery_time?(deliveryDate||'—')+(o.delivery_time?' · '+esc(o.delivery_time):''):'—';const items=(o.order_items||[]).map(i=>`${esc(i.product_name)} × ${Number(i.quantity||1)}${i.line_total!=null?' — '+Number(i.line_total).toLocaleString('ru-RU')+' ₽':''}`).join('<br>')||'—';return `<article class="order"><div class="order-head"><div><div class="order-title"><b>#${o.id}</b> — ${esc(o.customers?.name||'Без имени')} — ${Number(o.total_amount).toLocaleString('ru-RU')} ₽</div><div class="muted">Оформлен: ${created}</div></div><span class="status">${esc(o.status||'—')}</span></div><div class="order-grid"><div class="order-field"><b>Телефон</b>${esc(o.customers?.phone||'Не указан')}</div><div class="order-field"><b>Email</b>${esc(o.customers?.email||'Не указан')}</div><div class="order-field"><b>Адрес доставки</b>${esc(o.delivery_address||'Не указан')}</div><div class="order-field"><b>Дата и время доставки</b>${delivery}</div></div><div class="order-items"><b>Состав заказа</b><div>${items}</div></div></article>`}).join('')||'<p>Заказов пока нет.</p>'}
async function loadSettings(){const {data}=await db.from('store_settings').select('*').eq('id',1).maybeSingle();if(!data)return;$('sname').value=data.store_name||'';$('sphone').value=data.phone||'';$('stelegram').value=data.telegram_url||'https://t.me/smflowersmsk';$('sinstagram').value=data.instagram_url||'https://www.instagram.com/smflowers.msk?igsh=enFqZGtuaW1qNWRi&utm_source=qr'}$('settings-form').onsubmit=async e=>{e.preventDefault();const r=await db.from('store_settings').update({store_name:$('sname').value.trim(),phone:$('sphone').value.trim(),telegram_url:$('stelegram').value.trim()||'https://t.me/smflowersmsk',instagram_url:$('sinstagram').value.trim()||'https://www.instagram.com/smflowers.msk?igsh=enFqZGtuaW1qNWRi&utm_source=qr',updated_at:new Date().toISOString()}).eq('id',1);setmsg('settings-msg',r.error?.message||'Настройки сохранены.',!!r.error)}
})();</script></body></html>
