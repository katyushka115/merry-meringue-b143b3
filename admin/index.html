<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>SM Flowers — Админка</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f1eb;color:#20251f;font:14px/1.5 Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.wrap{width:min(1180px,calc(100% - 32px));margin:32px auto}.card{background:#fff;border:1px solid #e7e1d8;border-radius:18px;padding:24px;box-shadow:0 8px 30px #0000000b}.login{max-width:460px;margin:10vh auto}.hidden{display:none!important}h1,h2{margin:0 0 10px}.muted{color:#777}.field{margin:14px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:11px 12px;border:1px solid #d9d4cc;border-radius:10px;background:#fff}.field textarea{min-height:90px;resize:vertical}.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:11px 16px;background:#263125;color:#fff}.btn.secondary{background:#eee9e1;color:#222}.btn.danger{background:#a83d35}.msg{min-height:22px;margin-top:10px}.error{color:#b3261e}.success{color:#287a45}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:20px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tab{border:1px solid #ddd5ca;background:#fff;color:#333;border-radius:10px;padding:9px 13px}.tab.active{background:#263125;color:#fff}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:20px}.product{display:grid;grid-template-columns:90px 1fr auto;gap:14px;align-items:center;border-top:1px solid #eee8df;padding:14px 0}.product:first-child{border-top:0}.product img{width:90px;height:90px;object-fit:cover;border-radius:10px;background:#eee}.price{font-weight:700}.status{display:inline-block;border-radius:999px;padding:4px 9px;background:#eee9e1}.orders{overflow:auto}.orders table{width:100%;border-collapse:collapse;min-width:760px}.orders th,.orders td{text-align:left;padding:10px;border-bottom:1px solid #eee8df;vertical-align:top}.small{font-size:12px}.preview{width:120px;height:120px;object-fit:cover;border-radius:10px;margin-top:8px}.empty{padding:20px 0;color:#777}.diagnostic{margin-top:12px;padding:10px;background:#f7f3ed;border-radius:10px;font-size:12px;white-space:pre-wrap;word-break:break-word}@media(max-width:800px){.grid,.row{grid-template-columns:1fr}.product{grid-template-columns:70px 1fr}.product .actions{grid-column:2}.product img{width:70px;height:70px}}
</style>
</head>
<body>
<div id="login" class="wrap login card">
<h1>SM Flowers</h1><p class="muted">Вход в панель управления</p>
<form id="login-form">
<div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" required></div>
<div class="field"><label>Пароль</label><input id="password" type="password" autocomplete="current-password" required></div>
<button id="login-button" class="btn" type="submit">Войти</button>
</form><div id="login-msg" class="msg" aria-live="polite"></div><div id="login-debug" class="diagnostic hidden"></div>
</div>

<div id="app" class="wrap hidden">
<div class="top"><div><h1>SM Flowers — админка</h1><div id="user-email" class="muted"></div></div><button id="logout" class="btn secondary">Выйти</button></div>
<div class="tabs"><button class="tab active" data-tab="products">Букеты</button><button class="tab" data-tab="orders">Заказы</button><button class="tab" data-tab="settings">Настройки</button></div>
<section id="products-tab"><div class="grid"><div class="card"><div class="top"><div><h2>Каталог</h2><div class="muted">Товары из Supabase</div></div><button id="new-product" class="btn">Новый букет</button></div><div id="product-list"></div></div>
<div class="card"><h2 id="form-title">Новый букет</h2><form id="product-form"><input id="product-id" type="hidden"><div class="field"><label>Название</label><input id="product-name" required></div><div class="row"><div class="field"><label>Цена</label><input id="product-price" type="number" min="0" step="0.01" required></div><div class="field"><label>Старая цена</label><input id="product-old-price" type="number" min="0" step="0.01"></div></div><div class="field"><label>Описание</label><textarea id="product-description"></textarea></div><div class="field"><label>Изображение</label><input id="product-image" type="file" accept="image/jpeg,image/png,image/webp"><div id="image-note" class="muted small"></div><img id="image-preview" class="preview hidden" alt=""></div><div class="row"><div class="field"><label>Порядок</label><input id="product-sort" type="number" value="0"></div><div class="field"><label>Категория</label><select id="product-category"><option value="">Без категории</option></select></div></div><div class="field"><label><input id="product-featured" type="checkbox"> Показывать как избранный</label><label><input id="product-active" type="checkbox" checked> Активен на сайте</label></div><div class="actions"><button class="btn" type="submit">Сохранить</button><button id="cancel-product" class="btn secondary" type="button">Очистить</button></div><div id="product-msg" class="msg"></div></form></div></div></section>
<section id="orders-tab" class="hidden"><div class="card"><div class="top"><div><h2>Заказы</h2><div class="muted">Новые заказы с сайта</div></div><button id="refresh-orders" class="btn secondary">Обновить</button></div><div class="orders"><table><thead><tr><th>№</th><th>Клиент</th><th>Доставка</th><th>Состав</th><th>Сумма</th><th>Статус</th></tr></thead><tbody id="orders-body"></tbody></table></div></div></section>
<section id="settings-tab" class="hidden"><div class="card"><h2>Настройки магазина</h2><form id="settings-form"><div class="row"><div class="field"><label>Название</label><input id="store-name"></div><div class="field"><label>Телефон</label><input id="store-phone"></div></div><div class="row"><div class="field"><label>Telegram</label><input id="store-telegram" value="https://t.me/smflowersmsk"></div><div class="field"><label>Instagram</label><input id="store-instagram" value="https://www.instagram.com/smflowers.msk?igsh=enFqZGtuaW1qNWRi&utm_source=qr"></div></div><button class="btn" type="submit">Сохранить настройки</button><div id="settings-msg" class="msg"></div></form></div></section>
</div>
<script>
const SUPABASE_URL='https://avlozhwwvjqiypifoxox.supabase.co';
const SUPABASE_KEY='sb_publishable_3FgdTAmKB8kw2QTrrVPA5g_vb1lya1d';
const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
const $=id=>document.getElementById(id);
function msg(id,text,error=false){const el=$(id);el.textContent=text;el.className='msg '+(error?'error':'success')}
function debug(text){const el=$('login-debug');el.textContent=text;el.classList.remove('hidden')}
function esc(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c]))}
async function verifyAdmin(){
 const {data:{user},error:userError}=await supabase.auth.getUser();
 if(userError) throw new Error('Не удалось получить пользователя: '+userError.message);
 if(!user) throw new Error('Сессия не создана. Проверьте email и пароль.');
 const {data,isError}=await supabase.rpc('is_admin');
 if(isError) throw new Error('Ошибка проверки прав администратора: '+isError.message);
 if(data!==true) throw new Error('Вход выполнен, но этот аккаунт не имеет прав администратора.');
 return user;
}
async function showApp(user){
 $('user-email').textContent=user.email||'';
 $('login').classList.add('hidden');$('app').classList.remove('hidden');
 msg('login-msg','');
 // Data loading must never hide the authenticated app. Each section reports its own error.
 await Promise.allSettled([loadCategories(),loadProducts(),loadOrders(),loadSettings()]);
}
$('login-form').addEventListener('submit',async e=>{
 e.preventDefault();const b=$('login-button');b.disabled=true;b.textContent='Входим…';msg('login-msg','Подключаемся к Supabase…');$('login-debug').classList.add('hidden');
 try{
  const email=$('email').value.trim(),password=$('password').value;
  const {data,error}=await supabase.auth.signInWithPassword({email,password});
  if(error) throw new Error('Supabase: '+error.message);
  if(!data?.session) throw new Error('Supabase не вернул активную сессию.');
  const user=await verifyAdmin();
  await showApp(user);
 }catch(error){
  console.error('Admin login error',error);
  msg('login-msg',error?.message||String(error)||'Не удалось войти.',true);
  debug('Техническая информация: '+(error?.message||String(error)));
 }finally{b.disabled=false;b.textContent='Войти'}
});
$('logout').onclick=async()=>{await supabase.auth.signOut();$('app').classList.add('hidden');$('login').classList.remove('hidden');$('password').value='';msg('login-msg','Вы вышли из админки.');};
window.addEventListener('error',e=>{console.error(e.error||e.message);if($('app').classList.contains('hidden')){msg('login-msg','Ошибка JavaScript: '+e.message,true);debug(e.filename+':'+e.lineno+':'+e.colno+'\n'+e.message)}});
window.addEventListener('unhandledrejection',e=>{console.error(e.reason);if($('app').classList.contains('hidden')){msg('login-msg','Ошибка подключения: '+(e.reason?.message||e.reason),true);debug(String(e.reason?.stack||e.reason))}});
window.addEventListener('load',async()=>{try{const {data:{session}}=await supabase.auth.getSession();if(session){const user=await verifyAdmin();await showApp(user)}}catch(error){console.error('Session restore',error);if(error?.message)msg('login-msg',error.message,true)}});
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');['products','orders','settings'].forEach(x=>$(x+'-tab').classList.toggle('hidden',x!==b.dataset.tab))});
async function loadCategories(){const {data,error}=await supabase.from('categories').select('id,name').eq('is_active',true).order('sort_order');if(error){msg('product-msg','Категории: '+error.message,true);return}$('product-category').innerHTML='<option value="">Без категории</option>'+(data||[]).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}
async function loadProducts(){const {data,error}=await supabase.from('products').select('*').order('sort_order',{ascending:true}).order('id',{ascending:true});if(error){msg('product-msg',error.message,true);return}const list=$('product-list');if(!data?.length){list.innerHTML='<div class="empty">Каталог пока пуст.</div>';return}list.innerHTML=data.map(p=>`<div class="product"><img src="${esc(p.image_url||'assets/bouquet-6.svg')}" alt=""><div><strong>${esc(p.name)}</strong><div class="small muted">${esc(p.description||'')}</div><div class="price">${Number(p.price).toLocaleString('ru-RU')} ₽</div><span class="status small">${p.is_active?'Активен':'Скрыт'}${p.is_featured?' · Избранный':''}</span></div><div class="actions"><button class="btn secondary edit" data-id="${p.id}">Изменить</button><button class="btn danger delete" data-id="${p.id}">Удалить</button></div></div>`).join('');list.querySelectorAll('.edit').forEach(b=>b.onclick=()=>editProduct(data.find(p=>String(p.id)===b.dataset.id)));list.querySelectorAll('.delete').forEach(b=>b.onclick=()=>deleteProduct(b.dataset.id))}
function resetProduct(){$('product-form').reset();$('product-id').value='';$('product-active').checked=true;$('form-title').textContent='Новый букет';$('image-preview').classList.add('hidden');$('image-note').textContent='';msg('product-msg','')}
function editProduct(p){$('product-id').value=p.id;$('product-name').value=p.name;$('product-price').value=p.price;$('product-old-price').value=p.old_price??'';$('product-description').value=p.description??'';$('product-sort').value=p.sort_order??0;$('product-category').value=p.category_id??'';$('product-featured').checked=!!p.is_featured;$('product-active').checked=p.is_active!==false;$('image-note').textContent=p.image_url||'Текущее изображение не задано';if(p.image_url){$('image-preview').src=p.image_url;$('image-preview').classList.remove('hidden')}$('form-title').textContent='Редактировать букет';window.scrollTo({top:0,behavior:'smooth'})}
$('new-product').onclick=resetProduct;$('cancel-product').onclick=resetProduct;
async function uploadImage(file){const ext=(file.name.split('.').pop()||'jpg').toLowerCase(),path=`${crypto.randomUUID()}.${ext}`;const {error}=await supabase.storage.from('bouquets').upload(path,file,{upsert:false,contentType:file.type});if(error)throw error;return supabase.storage.from('bouquets').getPublicUrl(path).data.publicUrl}
$('product-image').onchange=e=>{const f=e.target.files[0];if(f){$('image-preview').src=URL.createObjectURL(f);$('image-preview').classList.remove('hidden');$('image-note').textContent=f.name}};
$('product-form').addEventListener('submit',async e=>{e.preventDefault();try{msg('product-msg','Сохраняем…');const id=$('product-id').value;let image=null;if(id){const old=await supabase.from('products').select('image_url').eq('id',id).single();if(old.error)throw old.error;image=old.data.image_url}if($('product-image').files[0])image=await uploadImage($('product-image').files[0]);const name=$('product-name').value.trim();const payload={name,slug:name.toLowerCase().replace(/[^a-zа-я0-9]+/gi,'-').replace(/^-|-$/g,''),price:Number($('product-price').value),old_price:$('product-old-price').value?Number($('product-old-price').value):null,description:$('product-description').value.trim()||null,image_url:image,sort_order:Number($('product-sort').value)||0,category_id:$('product-category').value?Number($('product-category').value):null,is_featured:$('product-featured').checked,is_active:$('product-active').checked};const r=id?await supabase.from('products').update(payload).eq('id',id):await supabase.from('products').insert(payload);if(r.error)throw r.error;msg('product-msg','Букет сохранён.');resetProduct();await loadProducts()}catch(error){msg('product-msg',error.message||'Не удалось сохранить букет',true)}});
async function deleteProduct(id){if(!confirm('Удалить букет?'))return;const {error}=await supabase.from('products').delete().eq('id',id);if(error){msg('product-msg',error.message,true);return}await loadProducts()}
async function loadOrders(){const {data,error}=await supabase.from('orders').select('id,status,total_amount,delivery_address,delivery_date,delivery_time,comment,created_at,customers(name,phone,email),order_items(product_name,quantity,price)').order('created_at',{ascending:false});const body=$('orders-body');if(error){body.innerHTML=`<tr><td colspan="6" class="error">${esc(error.message)}</td></tr>`;return}if(!data?.length){body.innerHTML='<tr><td colspan="6" class="empty">Заказов пока нет.</td></tr>';return}body.innerHTML=data.map(o=>`<tr><td>#${o.id}<div class="small muted">${new Date(o.created_at).toLocaleString('ru-RU')}</div></td><td><strong>${esc(o.customers?.name)}</strong><br>${esc(o.customers?.phone||'')}<br>${esc(o.customers?.email||'')}</td><td>${esc(o.delivery_address||'')}<br>${o.delivery_date?new Date(o.delivery_date).toLocaleDateString('ru-RU'):''} ${esc(o.delivery_time||'')}<br>${esc(o.comment||'')}</td><td>${(o.order_items||[]).map(i=>`${esc(i.product_name)} × ${i.quantity}`).join('<br>')}</td><td><strong>${Number(o.total_amount).toLocaleString('ru-RU')} ₽</strong></td><td><select class="order-status" data-id="${o.id}"><option ${o.status==='new'?'selected':''} value="new">Новый</option><option ${o.status==='confirmed'?'selected':''} value="confirmed">Подтверждён</option><option ${o.status==='completed'?'selected':''} value="completed">Выполнен</option><option ${o.status==='cancelled'?'selected':''} value="cancelled">Отменён</option></select></td></tr>`).join('');body.querySelectorAll('.order-status').forEach(s=>s.onchange=async()=>{const {error}=await supabase.from('orders').update({status:s.value}).eq('id',s.dataset.id);if(error)alert(error.message)})}
$('refresh-orders').onclick=loadOrders;
async function loadSettings(){const {data,error}=await supabase.from('store_settings').select('id,store_name,phone,telegram_url,instagram_url').eq('id',1).maybeSingle();if(error){msg('settings-msg',error.message,true);return}if(!data)return;$('store-name').value=data.store_name||'';$('store-phone').value=data.phone||'';$('store-telegram').value=data.telegram_url||'https://t.me/smflowersmsk';$('store-instagram').value=data.instagram_url||'https://www.instagram.com/smflowers.msk?igsh=enFqZGtuaW1qNWRi&utm_source=qr')}
$('settings-form').addEventListener('submit',async e=>{e.preventDefault();const {error}=await supabase.from('store_settings').update({store_name:$('store-name').value.trim(),phone:$('store-phone').value.trim(),telegram_url:$('store-telegram').value.trim()||'https://t.me/smflowersmsk',instagram_url:$('store-instagram').value.trim()||'https://www.instagram.com/smflowers.msk?igsh=enFqZGtuaW1qNWRi&utm_source=qr',updated_at:new Date().toISOString()}).eq('id',1);msg('settings-msg',error?error.message:'Настройки сохранены.',!!error)});
</script>
</body>
</html>
