<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SM Flowers — админка</title>
<style>html,body{margin:0;height:100%;background:#f5f1eb}#adminFrame{display:block;width:100%;height:100vh;border:0}</style>
</head>
<body>
<iframe id="adminFrame" src="../admin-panel.html?v=20260826-2" title="SM Flowers — админка"></iframe>
<script>
(function(){
const frame=document.getElementById('adminFrame');
const DB='https://avlozhwwvjqiypifoxox.supabase.co';
const KEY='sb_publishable_3FgdTAmKB8kw2QTrrVPA5g_vb1lya1d';
const H={'apikey':KEY,'Authorization':'Bearer '+KEY};
const labels={'Букеты':'Букеты недели'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const media=u=>u||'';
function install(){
 try{
  const doc=frame.contentDocument;if(!doc)return;
  const st=doc.createElement('style');
  st.textContent='.site-grid{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:12px!important}.site-tile{pointer-events:auto!important}@media(max-width:800px){.site-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px!important}}@media(max-width:520px){.site-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:7px!important}.site-tile{min-height:70px!important;padding:8px!important;font-size:11px!important}}';
  doc.head.appendChild(st);
  const grid=doc.getElementById('siteGrid');
  if(!grid||grid.dataset.smWeeklyBound)return;
  grid.dataset.smWeeklyBound='1';
  grid.addEventListener('click',e=>{const tile=e.target.closest('.site-tile');if(!tile)return;const name=(tile.querySelector('strong')?.textContent||'').trim();if(name==='Букеты недели')showWeekly();},true);
 }catch(e){console.error(e)}
}
async function getProducts(){
 const r=await fetch(DB+'/rest/v1/products?select=id,name,slug,price,description,image_url,is_active,sort_order&order=sort_order.asc,id.asc',{headers:H,cache:'no-store'});
 if(!r.ok)throw new Error('Supabase products: HTTP '+r.status);
 return r.json();
}
async function showWeekly(){
 const doc=frame.contentDocument;if(!doc)return;
 const box=doc.getElementById('siteEditor');if(!box)return;
 box.classList.remove('hidden');box.innerHTML='<p class="muted">Загрузка букетов…</p>';
 try{
  const products=await getProducts();
  box.innerHTML='<div class="actions"><h3>Букеты недели</h3><button type="button" class="secondary" id="smClose">Закрыть</button></div><p class="muted">Каталог подключён напрямую к Supabase. Всего букетов: <b>'+products.length+'</b>. Здесь отображаются все активные букеты в порядке сайта.</p><div class="grid">'+(products.filter(p=>p.is_active!==false).map(p=>'<article class="card" style="margin:0;padding:14px"><img class="thumb" style="width:100%;height:180px" src="'+esc(media(p.image_url))+'" alt="'+esc(p.name)+'"><h4>'+esc(p.name)+'</h4><div><b>'+Number(p.price||0).toLocaleString('ru-RU')+' ₽</b></div><p class="muted">'+esc(p.description||'')+'</p><button type="button" data-week-edit="'+esc(p.id)+'">Редактировать букет</button></article>').join('')||'<p class="muted">Нет активных букетов.</p>')+'</div>';
  doc.getElementById('smClose').onclick=()=>box.classList.add('hidden');
  doc.querySelectorAll('[data-week-edit]').forEach(b=>b.onclick=()=>{const tab=doc.querySelector('[data-tab="products"]');if(tab)tab.click();setTimeout(()=>{const edit=doc.querySelector('[data-edit="'+CSS.escape(String(b.dataset.weekEdit))+'"]');if(edit)edit.click()},300)});
 }catch(e){box.innerHTML='<p class="notice">Не удалось загрузить букеты: '+esc(e.message)+'</p>'}
}
frame.addEventListener('load',()=>{install();setTimeout(install,300);setTimeout(install,1000)});
setInterval(install,1200);
})();
</script>
</body>
</html>
