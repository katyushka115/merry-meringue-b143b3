<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SM Flowers — админка временно недоступна</title>
<style>
:root{--ink:#1f261e;--olive:#354032;--paper:#f3efe7;--muted:rgba(31,38,30,.62)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink)}
body{display:grid;place-items:center;min-height:100svh;padding:32px;font-family:Arial,"Helvetica Neue",sans-serif}
main{width:min(760px,100%);padding:clamp(42px,8vw,88px);text-align:center;background:#faf8f3;border:1px solid rgba(31,38,30,.14);box-shadow:0 20px 60px rgba(31,38,30,.08)}
.brand{margin:0 0 36px;font-family:Georgia,serif;font-size:clamp(34px,7vw,58px);line-height:1}
.label{margin:0 0 18px;font-size:10px;font-weight:700;letter-spacing:.22em;text-transform:uppercase}
h1{margin:0;font-family:Georgia,serif;font-size:clamp(38px,6vw,62px);font-weight:400;line-height:1.05}
p{max-width:520px;margin:26px auto 0;color:var(--muted);font-size:16px;line-height:1.7}
.note{margin-top:38px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:rgba(31,38,30,.45)}
</style>
</head>
<body>
<main>
  <div class="brand">SM Flowers</div>
  <div class="label">Временная пауза</div>
  <h1>Извините, сайт временно не действует, скоро вернемся</h1>
  <p>Мы скоро вернёмся. Все данные, каталог и настройки сохранены.</p>
  <div class="note">Спасибо за понимание</div>
</main>
</body>
</html>
