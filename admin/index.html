<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SM Flowers — Админка</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f7f4f0;
      color: #222;
    }

    .admin {
      width: min(900px, calc(100% - 32px));
      margin: 50px auto;
    }

    .card {
      background: #fff;
      padding: 32px;
      border-radius: 18px;
      box-shadow: 0 10px 40px rgba(0,0,0,.08);
    }

    h1 {
      margin-top: 0;
      font-size: 32px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      margin-top: 24px;
      padding: 14px 22px;
      border: 0;
      border-radius: 10px;
      background: #222;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: .85;
    }

    #message {
      margin-top: 18px;
      min-height: 24px;
    }

    .hidden {
      display: none;
    }

    .success {
      color: #287a45;
    }

    .error {
      color: #b3261e;
    }
  </style>
</head>

<body>

  <main class="admin">

    <div id="netlify-login">

  <p>
    Для входа в панель управления используйте аккаунт
    Netlify Identity.
  </p>

  <button id="login-button" type="button">
    Войти в админку
  </button>

  <div id="message"></div>

</div>


    <div class="card hidden" id="admin-card">

  <h1>Букеты</h1>

  <p class="subtitle">
    Добавление нового букета
  </p>

  <form id="bouquet-form">

    <label for="bouquet-name">Название букета</label>
    <input
      id="bouquet-name"
      type="text"
      placeholder="Например: Нежный"
      required
    >

    <label for="bouquet-price">Цена</label>
    <input
      id="bouquet-price"
      type="number"
      placeholder="Например: 5900"
      min="0"
      required
    >

    <label for="bouquet-description">Описание</label>
    <input
      id="bouquet-description"
      type="text"
      placeholder="Короткое описание букета"
    >

    <label for="bouquet-image">Фотография</label>
    <input
      id="bouquet-image"
      type="file"
      accept="image/jpeg,image/png,image/webp"
      required
    >

    <button type="submit">
      Добавить букет
    </button>

  </form>

  <div id="bouquet-message"></div>

  <button id="logout">
    Выйти
  </button>

</div>

  </main>


  <script src="https://unpkg.com/netlify-identity-widget@1.9.2/build/netlify-identity-widget.js"></script>

<script>
  const loginCard = document.getElementById("login-card");
  const adminCard = document.getElementById("admin-card");
  const loginButton = document.getElementById("login-button");
  const message = document.getElementById("message");
  const logoutButton = document.getElementById("logout");

  const netlifyIdentity = window.netlifyIdentity;

  netlifyIdentity.on("init", user => {
    if (user) {
      showAdmin();
    }
  });

  loginButton.addEventListener("click", () => {
    netlifyIdentity.open("login");
  });

  netlifyIdentity.on("login", user => {
    showAdmin();
    netlifyIdentity.close();
  });

  netlifyIdentity.on("logout", () => {
    adminCard.classList.add("hidden");
    loginCard.classList.remove("hidden");
  });

  logoutButton.addEventListener("click", () => {
    netlifyIdentity.logout();
  });

  function showAdmin() {
    loginCard.classList.add("hidden");
    adminCard.classList.remove("hidden");
  }
</script>

</body>
</html>
