<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SM Flowers — админка</title>
<style>
html,body{margin:0;height:100%;background:#f5f1eb}
#adminFrame{display:block;width:100%;height:100vh;border:0}
</style>
</head>
<body>
<iframe id="adminFrame" src="../admin-panel.html" title="SM Flowers — админка"></iframe>
<script>
(function(){
  const frame=document.getElementById('adminFrame');
  frame.addEventListener('load',function(){
    try{
      const doc=frame.contentDocument;
      if(!doc)return;
      const style=doc.createElement('style');
      style.textContent=`
        .site-grid{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:12px!important}
        .site-tile{cursor:pointer!important;box-sizing:border-box!important}
        @media(max-width:800px){.site-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px!important}.site-tile{min-height:76px!important;padding:10px!important;font-size:12px!important}.site-tile .icon{font-size:18px!important}}
        @media(max-width:520px){.site-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:7px!important}.site-tile{min-height:70px!important;padding:8px!important;font-size:11px!important}.site-tile .icon{font-size:17px!important}}
      `;
      doc.head.appendChild(style);
    }catch(e){console.error('SM admin layout',e)}
  });
})();
</script>
</body>
</html>
