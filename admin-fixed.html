<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SM Flowers — админка</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font:14px Arial;background:#f5f1eb;color:#20251f;margin:0}.wrap{max-width:1150px;margin:25px auto;padding:0 14px}.card{background:#fff;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 3px 16px #00000008}input,textarea{width:100%;box-sizing:border-box;padding:10px;margin:5px 0 12px;border:1px solid #ddd;border-radius:9px}button{padding:10px 14px;border:0;border-radius:9px;background:#263125;color:white;cursor:pointer}.hidden{display:none}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.row{border-top:1px solid #eee;padding:15px 0}.accordion{border:1px solid #ddd8d0;border-radius:16px;margin:10px 0;overflow:hidden}.accordion>button{width:100%;text-align:left;border-radius:0;background:#fff;color:#20251f;font-weight:700;display:flex;justify-content:space-between;padding:16px}.accordion.open>button{background:#263125;color:#fff}.accordion-body{padding:18px}.block-label{display:flex;gap:12px}.block-icon{font-size:22px}.thumb{width:130px;height:100px;object-fit:cover;border-radius:10px}.order{border-top:1px solid #eee;padding:15px 0}.order-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 22px}@media(max-width:700px){.order-grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section id="login" class="card"><h1>SM Flowers — админка</h1><form id="loginForm"><input id="email" type="email" placeholder="Электронная почта" required><input id="password" type="password" placeholder="Пароль" required><button>Войти</button></form><p id="loginMsg"></p></section><section id="app" class="hidden"><div class="card"><h1>SM Flowers — админка</h1><div id="user"></div><button id="logout">Выйти</button><nav class="tabs"><button data-tab="products">Букеты</button><button data-tab="site">Редактор сайта</button><button data-tab="orders">Заказы</button><button data-tab="settings">Настройки</button></nav></div><section id="products" class="card panel"><h2>Букеты</h2><div id="productsList"></div><form id="productForm"><input id="pid" type="hidden"><input id="pname" placeholder="Название" required><input id="pprice" type="number" placeholder="Цена" required><textarea id="pdesc" placeholder="Описание"></textarea><input id="pfile" type="file" accept="image/*"><label><input id="pactive" type="checkbox" checked> Показывать</label><button>Сохранить букет</button></form><p id="pmsg"></p></section><section id="site" class="card panel hidden"><h2>Редактор сайта</h2><p>Блоки идут в порядке сайта.</p><div id="siteBlocks"></div></section><section id="orders" class="card panel hidden"><h2>Заказы</h2><div id="ordersList"></div></section><section id="settings" class="card panel hidden"><h2>Настройки</h2><div id="settingsList"></div></section></section></main><script>(()=>{const db=supabase.createClient(location.origin+'/supabase','sb_publishable_3FgdTAmKB8kw2QTrrVPA5g_vb1lya1d',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}}),$=id=>document.getElementById(id),BUCKET='bouquets',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function slugify(s){const m={а:'a',б:'b',в:'v',г:'g',д:'d',е:'e',ё:'e',ж:'zh',з:'z',и:'i',й:'y',к:'k',л:'l',м:'m',н:'n',о:'o',п:'p',р:'r',с:'s',т:'t',у:'u',ф:'f',х:'h',ц:'c',ч:'ch',ш:'sh',щ:'sch',ъ:'',ы:'y',ь:'',э:'e',ю:'yu',я:'ya'};return s.toLowerCase().split('').map(c=>m[c]??c).join('').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')||'bouquet-'+crypto.randomUUID().slice(0,8)}async function isAdmin(){const s=await db.auth.getSession();if(s.error||!s.data.session?.user)throw new Error(s.error?.message||'Сессия авторизации не найдена');return s.data.session.user}async function upload(f,folder){const ext=(f.name.split('.').pop()||'jpg').toLowerCase(),path=folder+'/'+crypto.randomUUID()+'.'+ext,r=await db.storage.from(BUCKET).upload(path,f,{contentType:f.type,upsert:false});if(r.error)throw r.error;return '/media/'+path}async function openApp(u){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('user').textContent=u?.email||'';loadProducts().catch(e=>$('productsList').textContent='Ошибка: '+e.message);loadOrders().catch(e=>$('ordersList').textContent='Ошибка: '+e.message);loadSettings().catch(e=>$('settingsList').textContent='Ошибка: '+e.message)}$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginMsg').textContent='Выполняется вход…';try{const r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)throw r.error;const u=await isAdmin();await openApp(u)}catch(e){$('loginMsg').textContent=e.message||'Не удалось войти'}};async function init(){try{const s=await db.auth.getSession();if(s.data.session)await openApp(await isAdmin())}catch(e){$('loginMsg').textContent=e.message}}$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.panel').forEach(x=>x.classList.add('hidden'));$(b.dataset.tab).classList.remove('hidden');if(b.dataset.tab==='site')loadSite().catch(e=>$('siteBlocks').textContent=e.message);if(b.dataset.tab==='orders')loadOrders()});async function loadProducts(){const r=await db.from('products').select('*').order('sort_order').order('id');if(r.error)throw r.error;$('productsList').innerHTML=(r.data||[]).map(p=>`<div class="row"><img class="thumb" src="${esc(p.image_url||'')}"><b>${esc(p.name)}</b> — ${Number(p.price||0).toLocaleString('ru-RU')} ₽ <button data-edit="${p.id}">Изменить</button></div>`).join('')||'Букетов пока нет';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const p=r.data.find(x=>String(x.id)===b.dataset.edit);$('pid').value=p.id;$('pname').value=p.name;$('pprice').value=p.price;$('pdesc').value=p.description||'';$('pactive').checked=p.is_active!==false})}$('productForm').onsubmit=async e=>{e.preventDefault();try{const id=$('pid').value,name=$('pname').value.trim();const payload={name,slug:slugify(name),price:Number($('pprice').value),description:$('pdesc').value.trim(),is_active:$('pactive').checked};const f=$('pfile').files[0];if(f)payload.image_url=await upload(f,'products');if(!id){const last=await db.from('products').select('sort_order').order('sort_order',{ascending:false}).limit(1).maybeSingle();if(last.error)throw last.error;payload.sort_order=Number(last.data?.sort_order||0)+1}const r=id?await db.from('products').update(payload).eq('id',id):await db.from('products').insert(payload);if(r.error)throw r.error;$('pmsg').textContent='Сохранено';$('productForm').reset();$('pid').value='';$('pactive').checked=true;await loadProducts()}catch(e){$('pmsg').textContent='Ошибка: '+e.message}};const order=['Главная','Навигация','О студии','Коллекции','На заказ','Букеты','Философия','Жизнь студии','Финальный блок','Контакты'],labels={'Главная':['🏠','Главный экран'],'Навигация':['🧭','Навигация'],'О студии':['✨','О студии'],'Коллекции':['🌸','Коллекции'],'На заказ':['💐','На заказ'],'Букеты':['🌷','Букеты'],'Философия':['🤍','Философия'],'Жизнь студии':['📸','Жизнь студии'],'Финальный блок':['✨','Финальный блок'],'Контакты':['📍','Контакты']};function ru(s){return ({footer:'Подвал сайта',Footer:'Подвал сайта',gallery:'Галерея',Gallery:'Галерея',hero:'Главный экран',Hero:'Главный экран',about:'О студии',About:'О студии',title:'Заголовок',description:'Описание',text:'Текст',image:'Фотография',photo:'Фотография',photos:'Фотографии',address:'Адрес',map:'Карта',route:'Маршрут'})[s]||String(s||'').replace(/_/g,' ').replace(/-/g,' ')}async function loadSite(){const[t,m]=await Promise.all([db.from('site_content').select('*').order('sort_order').order('id'),db.from('site_media').select('*').order('sort_order').order('id')]);if(t.error||m.error)throw t.error||m.error;const secs=[...new Set([...(t.data||[]).map(x=>x.section),...(m.data||[]).map(x=>x.section))],ordered=[...order.filter(s=>secs.includes(s)),...secs.filter(s=>!order.includes(s))];$('siteBlocks').innerHTML=ordered.map(s=>{const meta=labels[s]||['📦',ru(s)],ts=t.data.filter(x=>x.section===s),ms=m.data.filter(x=>x.section===s);return `<article class="accordion"><button type="button"><span class="block-label"><span class="block-icon">${meta[0]}</span>${esc(meta[1])}</span><span>＋</span></button><div class="accordion-body hidden">${ts.map(x=>`<div class="row"><b>${esc(ru(x.label||x.content_key))}</b><textarea data-t="${x.id}">${esc(x.content||'')}</textarea><button data-st="${x.id}">Сохранить текст</button></div>`).join('')}<h3>📷 Фотографии</h3>${ms.map(x=>`<div class="row"><b>${esc(ru(x.label||x.slot_key))}</b><br><img class="thumb" src="${esc(x.image_url||'')}"><input type="file" accept="image/*" data-f="${x.id}"><button data-sf="${x.id}">Заменить фотографию</button></div>`).join('')}<div class="row"><b>➕ Добавить фотографию</b><input data-l="${esc(s)}" placeholder="Название фотографии"><input type="file" accept="image/*" data-n="${esc(s)}"><button data-a="${esc(s)}">Добавить</button></div></div></article>`}).join('');document.querySelectorAll('.accordion>button').forEach(b=>b.onclick=()=>{const body=b.parentElement.querySelector('.accordion-body');body.classList.toggle('hidden');b.parentElement.classList.toggle('open');b.lastElementChild.textContent=body.classList.contains('hidden')?'＋':'−'});document.querySelectorAll('[data-st]').forEach(b=>b.onclick=async()=>{const r=await db.from('site_content').update({content:document.querySelector(`[data-t="${b.dataset.st}"]`).value,updated_at:new Date().toISOString()}).eq('id',b.dataset.st);if(r.error)alert(r.error.message)});document.querySelectorAll('[data-sf]').forEach(b=>b.onclick=async()=>{try{const f=document.querySelector(`[data-f="${b.dataset.sf}"]`).files[0];if(!f)return alert('Выберите фотографию');const url=await upload(f,'site-media'),r=await db.from('site_media').update({image_url:url,updated_at:new Date().toISOString()}).eq('id',b.dataset.sf);if(r.error)throw r.error;loadSite()}catch(e){alert(e.message)}});document.querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{try{const s=b.dataset.a,f=document.querySelector(`[data-n="${CSS.escape(s)}"]`).files[0],label=document.querySelector(`[data-l="${CSS.escape(s)}"]`).value.trim()||'Новая фотография';if(!f)return alert('Выберите фотографию');const url=await upload(f,'site-media'),last=await db.from('site_media').select('sort_order').eq('section',s).order('sort_order',{ascending:false}).limit(1).maybeSingle();if(last.error)throw last.error;const r=await db.from('site_media').insert({section:s,slot_key:'extra-'+crypto.randomUUID(),label,image_url:url,sort_order:Number(last.data?.sort_order||0)+1,is_visible:true});if(r.error)throw r.error;loadSite()}catch(e){alert(e.message)}})}async function loadOrders(){const r=await db.from('orders').select('*').order('created_at',{ascending:false});if(r.error)throw r.error;$('ordersList').innerHTML=(r.data||[]).map(o=>`<div class="order"><b>Заказ #${o.id}</b> — ${esc(o.status||'Новый')} — ${Number(o.total_amount||0).toLocaleString('ru-RU')} ₽<div class="order-grid"><div>Клиент: ${esc(o.customer_name||o.name||'—')}<br>Телефон: ${esc(o.phone||'—')}</div><div>Адрес: ${esc(o.delivery_address||o.address||'—')}<br>Дата: ${esc(o.delivery_date||'—')}</div></div></div>`).join('')||'Заказов пока нет'}async function loadSettings(){const r=await db.from('store_settings').select('*').limit(1).maybeSingle();if(r.error)throw r.error;$('settingsList').textContent=r.data?'Настройки загружены':'Настройки не найдены'}init()})();</script></body></html>
