<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SM Flowers — админка</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font:14px Arial;background:#f5f1eb;color:#20251f;margin:0}.wrap{max-width:1150px;margin:25px auto;padding:0 14px}.card{background:white;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 3px 16px #00000008}input,textarea{width:100%;box-sizing:border-box;padding:10px;margin:5px 0 12px;border:1px solid #ddd;border-radius:9px}button{padding:10px 14px;border:0;border-radius:9px;background:#263125;color:white;cursor:pointer}.secondary{background:#eee9e1;color:#222}.hidden{display:none}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.row{border-top:1px solid #eee;padding:15px 0}.thumb{width:130px;height:100px;object-fit:cover;border-radius:10px}.actions{display:flex;gap:8px;flex-wrap:wrap}.accordion{border:1px solid #ddd8d0;border-radius:16px;margin:10px 0;overflow:hidden}.accordion>button{width:100%;text-align:left;border-radius:0;background:#fff;color:#20251f;font-weight:700;display:flex;justify-content:space-between;align-items:center;padding:16px 18px;font-size:15px}.accordion.open>button{background:#263125;color:#fff}.accordion-body{padding:18px;border-top:1px solid #eee}.block-label{display:flex;align-items:center;gap:12px}.block-icon{font-size:22px;width:32px;text-align:center}.order{border-top:1px solid #eee;padding:15px 0}.order-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 22px;margin-top:12px}.field{padding:8px 0}.field b{display:block;color:#5c625a;margin-bottom:3px}.comment{margin-top:12px;padding:12px;background:#f7f3ed;border-radius:10px}.hint{color:#687064}@media(max-width:700px){.grid,.order-grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section id="login" class="card"><h1>SM Flowers — админка</h1><form id="loginForm"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Пароль" required><button>Войти</button></form><p id="loginMsg"></p></section><section id="app" class="hidden"><div class="card"><div class="actions"><h1 style="margin-right:auto">SM Flowers — админка</h1><button id="logout" class="secondary">Выйти</button></div><div id="user"></div><nav class="tabs"><button data-tab="products">Букеты</button><button data-tab="site">Редактор сайта</button><button data-tab="orders">Заказы</button><button data-tab="settings">Настройки</button></nav></div><section id="products" class="card panel"><h2>Букеты</h2><div class="grid"><div><div id="productsList"></div></div><div><form id="productForm"><input id="pid" type="hidden"><input id="pname" placeholder="Название" required><input id="pprice" type="number" placeholder="Цена" required><textarea id="pdesc" placeholder="Описание"></textarea><input id="pfile" type="file" accept="image/*"><label><input id="pactive" type="checkbox" checked> Показывать</label><button>Сохранить букет</button></form><p id="pmsg"></p></div></div></section><section id="site" class="card panel hidden"><h2>Редактор сайта</h2><p class="hint">Каждый блок открывается отдельно. Внутри можно редактировать тексты, заменять фотографии и добавлять новые фотографии.</p><div id="siteBlocks"></div></section><section id="orders" class="card panel hidden"><h2>Заказы</h2><div id="ordersList"></div></section><section id="settings" class="card panel hidden"><h2>Настройки</h2><div id="settingsList"></div></section></section></main><script>(()=>{const db=supabase.createClient(location.origin+'/supabase','sb_publishable_3FgdTAmKB8kw2QTrrVPA5g_vb1lya1d',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}}),BUCKET='bouquets',$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const media=u=>{if(!u)return'';if(u.startsWith('/media/'))return u;try{const x=new URL(u),needle=`/storage/v1/object/public/${BUCKET}/`,i=x.pathname.indexOf(needle);return i>=0?'/media/'+x.pathname.slice(i+needle.length):u}catch{return u}};async function upload(f,folder){const ext=(f.name.split('.').pop()||'jpg').toLowerCase(),path=`${folder}/${crypto.randomUUID()}.${ext}`,r=await db.storage.from(BUCKET).upload(path,f,{contentType:f.type,upsert:false});if(r.error)throw r.error;return '/media/'+path}function slugify(s){const map={а:'a',б:'b',в:'v',г:'g',д:'d',е:'e',ё:'e',ж:'zh',з:'z',и:'i',й:'y',к:'k',л:'l',м:'m',н:'n',о:'o',п:'p',р:'r',с:'s',т:'t',у:'u',ф:'f',х:'h',ц:'c',ч:'ch',ш:'sh',щ:'sch',ъ:'',ы:'y',ь:'',э:'e',ю:'yu',я:'ya'};let x=s.toLowerCase().split('').map(c=>map[c]??c).join('');x=x.replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');return x||('bouquet-'+crypto.randomUUID().slice(0,8))}async function admin(){const r=await db.rpc('is_admin');if(r.error||r.data!==true)throw new Error(r.error?.message||'Нет прав администратора');return(await db.auth.getUser()).data.user}async function show(u){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('user').textContent=u.email||'';await Promise.all([loadProducts(),loadOrders(),loadSettings()])}async function init(){const s=await db.auth.getSession();if(!s.data.session)return;await show(await admin())}$('loginForm').onsubmit=async e=>{e.preventDefault();try{const r=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(r.error)throw r.error;await show(await admin())}catch(e){$('loginMsg').textContent=e.message}};$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.panel').forEach(x=>x.classList.add('hidden'));$(b.dataset.tab).classList.remove('hidden');if(b.dataset.tab==='site')loadSite();if(b.dataset.tab==='orders')loadOrders()});async function loadProducts(){const r=await db.from('products').select('*').order('sort_order').order('id');if(r.error){$('productsList').textContent=r.error.message;return}$('productsList').innerHTML=(r.data||[]).map(p=>`<div class="row"><img class="thumb" src="${esc(media(p.image_url))}"><b>${esc(p.name)}</b> — ${Number(p.price||0).toLocaleString('ru-RU')} ₽ <button data-edit="${p.id}">Изменить</button></div>`).join('')||'Нет букетов';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const p=r.data.find(x=>String(x.id)===b.dataset.edit);$('pid').value=p.id;$('pname').value=p.name;$('pprice').value=p.price;$('pdesc').value=p.description||'';$('pactive').checked=p.is_active!==false})}$('productForm').onsubmit=async e=>{e.preventDefault();try{const id=$('pid').value,f=$('pfile').files[0];let image=null;if(f)image=await upload(f,'products');else if(id){const old=await db.from('products').select('image_url').eq('id',id).single();if(old.error)throw old.error;image=old.data.image_url}const name=$('pname').value.trim();if(!name)throw new Error('Введите название букета');const payload={name,slug:slugify(name),price:Number($('pprice').value),description:$('pdesc').value.trim(),is_active:$('pactive').checked};if(image)payload.image_url=image;if(!id){const last=await db.from('products').select('sort_order').order('sort_order',{ascending:false}).limit(1).maybeSingle();payload.sort_order=Number(last.data?.sort_order||0)+1}const r=id?await db.from('products').update(payload).eq('id',id):await db.from('products').insert(payload);if(r.error)throw r.error;$('pmsg').textContent='Сохранено';$('productForm').reset();$('pid').value='';$('pactive').checked=true;await loadProducts()}catch(e){$('pmsg').textContent=e.message}};const order=['Главная','Навигация','О студии','Коллекции','На заказ','Букеты','Философия','Жизнь студии','Финальный блок','Контакты'],labels={'Главная':['🏠','Главный экран'],'Навигация':['🧭','Навигация'],'О студии':['✨','О студии'],'Коллекции':['🌸','Коллекции'],'На заказ':['💐','На заказ'],'Букеты':['🌷','Букеты'],'Философия':['🤍','Философия'],'Жизнь студии':['📸','Жизнь студии'],'Финальный блок':['✨','Финальный блок'],'Контакты':['📍','Контакты']};async function loadSite(){const[t,m]=await Promise.all([db.from('site_content').select('*').order('section').order('sort_order').order('id'),db.from('site_media').select('*').order('section').order('sort_order').order('id')]);if(t.error||m.error){$('siteBlocks').textContent=(t.error||m.error).message;return}const present=[...new Set([...(t.data||[]).map(x=>x.section),...(m.data||[]).map(x=>x.section)])],sections=[...order.filter(s=>present.includes(s)),...present.filter(s=>!order.includes(s))];$('siteBlocks').innerHTML=sections.map(s=>{const ts=t.data.filter(x=>x.section===s),ms=m.data.filter(x=>x.section===s),meta=labels[s]||['📦',s];return `<article class="accordion"><button type="button"><span class="block-label"><span class="block-icon">${meta[0]}</span><span>${esc(meta[1])}</span></span><span>＋</span></button><div class="accordion-body hidden"><h3>${esc(meta[1])}</h3>${ts.map(x=>`<div class="row"><b>${esc(x.label||x.content_key)}</b><textarea data-text="${x.id}">${esc(x.content||'')}</textarea><button data-tsave="${x.id}">Сохранить текст</button></div>`).join('')||'<p class="hint">Текстов нет.</p>'}<h3>📷 Фотографии</h3>${ms.map(x=>`<div class="row"><b>${esc(x.label||x.slot_key)}</b><br><img class="thumb" src="${esc(media(x.image_url))}"><input type="file" accept="image/*" data-mf="${x.id}"><button data-msave="${x.id}">Заменить фото</button></div>`).join('')||'<p class="hint">Фотографий пока нет.</p>'}<div class="row"><b>➕ Добавить фотографию в этот блок</b><input type="text" data-newlabel="${esc(s)}" placeholder="Название фотографии"><input type="file" accept="image/*" data-newfile="${esc(s)}"><button data-addphoto="${esc(s)}">Добавить фотографию</button></div></div></article>`}).join('');document.querySelectorAll('.accordion>button').forEach(b=>b.onclick=()=>{const a=b.parentElement,body=a.querySelector('.accordion-body');a.classList.toggle('open');body.classList.toggle('hidden');b.lastElementChild.textContent=body.classList.contains('hidden')?'＋':'−'});document.querySelectorAll('[data-tsave]').forEach(b=>b.onclick=async()=>{const r=await db.from('site_content').update({content:document.querySelector(`[data-text="${b.dataset.tsave}"]`).value,updated_at:new Date().toISOString()}).eq('id',b.dataset.tsave);if(r.error)alert(r.error.message);else b.textContent='Сохранено'});document.querySelectorAll('[data-msave]').forEach(b=>b.onclick=async()=>{try{const f=document.querySelector(`[data-mf="${b.dataset.msave}"]`).files[0];if(!f)return alert('Выберите фото');const url=await upload(f,'site-media'),r=await db.from('site_media').update({image_url:url,updated_at:new Date().toISOString()}).eq('id',b.dataset.msave);if(r.error)throw r.error;await loadSite()}catch(e){alert(e.message)}});document.querySelectorAll('[data-addphoto]').forEach(b=>b.onclick=async()=>{try{const s=b.dataset.addphoto,f=document.querySelector(`[data-newfile="${CSS.escape(s)}"]`).files[0],label=(document.querySelector(`[data-newlabel="${CSS.escape(s)}"]`).value||'Новая фотография').trim();if(!f)return alert('Выберите фотографию');const url=await upload(f,'site-media'),last=await db.from('site_media').select('sort_order').eq('section',s).order('sort_order',{ascending:false}).limit(1).maybeSingle();const next=Number(last.data?.sort_order||0)+1,r=await db.from('site_media').insert({section:s,slot_key:'extra-'+crypto.randomUUID(),label,image_url:url,sort_order:next,is_visible:true});if(r.error)throw r.error;await loadSite()}catch(e){alert(e.message)}})}async function loadOrders(){const r=await db.from('orders').select('id,status,total_amount,delivery_address,delivery_date,delivery_time,comment,created_at,customers(name,phone,email),order_items(product_name,quantity,price)').order('created_at',{ascending:false});if(r.error){$('ordersList').textContent=r.error.message;return}$('ordersList').innerHTML=(r.data||[]).map(o=>{const created=o.created_at?new Date(o.created_at).toLocaleString('ru-RU',{dateStyle:'short',timeStyle:'short'}):'—',dd=o.delivery_date?new Date(o.delivery_date+'T00:00:00').toLocaleDateString('ru-RU'):'';return `<article class="order"><b>Заказ #${o.id}</b> — ${esc(o.status||'new')} — ${Number(o.total_amount||0).toLocaleString('ru-RU')} ₽<div class="order-grid"><div class="field"><b>Клиент</b>${esc(o.customers?.name||'—')}<br>${esc(o.customers?.phone||'')}<br>${esc(o.customers?.email||'')}</div><div class="field"><b>Создан</b>${created}<br><b>Сумма</b>${Number(o.total_amount||0).toLocaleString('ru-RU')} ₽</div><div class="field"><b>Доставка</b>${esc(o.delivery_address||'—')}<br>${dd?esc(dd):''}${o.delivery_time?' · '+esc(o.delivery_time):''}</div><div class="field"><b>Состав</b>${(o.order_items||[]).map(i=>`${esc(i.product_name||'')} × ${esc(i.quantity||1)} — ${Number(i.price||0).toLocaleString('ru-RU')} ₽`).join('<br>')||'—'}</div></div>${o.comment?`<div class="comment"><b>Комментарий:</b><br>${esc(o.comment)}</div>`:''}</article>`}).join('')||'Заказов пока нет'}async function loadSettings(){const r=await db.from('store_settings').select('*').limit(1).maybeSingle();if(r.error||!r.data){$('settingsList').textContent='Настройки не найдены';return}const d=r.data;$('settingsList').innerHTML=Object.keys(d).map(k=>`<label>${esc(k)}<input data-setting="${esc(k)}" value="${esc(d[k])}"></label>`).join('')+'<button id="saveSettings">Сохранить настройки</button>';$('saveSettings').onclick=async()=>{const patch={};document.querySelectorAll('[data-setting]').forEach(i=>patch[i.dataset.setting]=i.value);const r=await db.from('store_settings').update(patch).eq('id',d.id);alert(r.error?r.error.message:'Сохранено')}}init()})();</script></body></html>
