<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3efe7">
  <title>SM Flowers — авторская флористика в Москве</title>
  <meta name="description" content="SM Flowers — студия авторской флористики в Москве. Букеты из свежих цветов, композиции на заказ и бережная доставка.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/mobile.css">
  <style>
    :root {
      --ink: #1f261e;
      --olive: #55614c;
      --olive-dark: #354032;
      --sage: #a9af96;
      --paper: #f3efe7;
      --paper-light: #faf8f3;
      --blush: #d9c6bd;
      --line: rgba(31, 38, 30, .17);
      --serif: "Cormorant Garamond", Georgia, serif;
      --sans: "Manrope", "Helvetica Neue", sans-serif;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper-light);
      font: 400 14px/1.7 var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    body.menu-open, body.modal-open { overflow: hidden; }
    img { display: block; max-width: 100%; }
    a { color: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { font: inherit; }
    :focus-visible { outline: 2px solid var(--olive); outline-offset: 4px; }
    .eyebrow { margin: 0 0 22px; font-size: 10px; font-weight: 600; letter-spacing: .24em; line-height: 1.4; text-transform: uppercase; }
    .display { margin: 0; font-family: var(--serif); font-size: clamp(48px, 6.5vw, 96px); font-weight: 400; letter-spacing: -.045em; line-height: .88; }
    .section-title { margin: 0; font-family: var(--serif); font-size: clamp(42px, 5vw, 72px); font-weight: 400; letter-spacing: -.035em; line-height: .98; }
    .section-title em, .display em { font-weight: 400; }
    .text-link { display: inline-flex; align-items: center; gap: 13px; padding: 7px 0; border-bottom: 1px solid currentColor; font-size: 11px; font-weight: 600; letter-spacing: .13em; line-height: 1.4; text-decoration: none; text-transform: uppercase; transition: gap .25s ease, opacity .25s ease; }
    .text-link:hover { gap: 19px; opacity: .7; }
    .arrow { font-size: 16px; line-height: 0; }
    .button { display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 26px; border: 1px solid var(--ink); border-radius: 0; background: var(--ink); color: #fff; font-size: 10px; font-weight: 600; letter-spacing: .16em; line-height: 1.3; text-decoration: none; text-transform: uppercase; cursor: pointer; transition: background .25s ease, color .25s ease, border-color .25s ease; }
    .button:hover { background: transparent; color: var(--ink); }
    .button--light { border-color: #fff; background: #fff; color: var(--ink); }
    .button--light:hover { background: transparent; color: #fff; }
    .button--outline { background: transparent; color: var(--ink); }
    .button--outline:hover { background: var(--ink); color: #fff; }
    .site-header { position: absolute; top: 0; right: 0; left: 0; z-index: 20; color: #fff; }
    .header-inner { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; width: min(100% - 72px, 1440px); min-height: 102px; margin: 0 auto; border-bottom: 1px solid rgba(255, 255, 255, .35); }
    .brand { display: inline-flex; flex-direction: column; width: max-content; color: #fff; line-height: 1; text-decoration: none; }
    .brand strong { font-family: var(--serif); font-size: 28px; font-weight: 500; letter-spacing: -.04em; }
    .brand span { margin-top: 6px; font-size: 8px; font-weight: 500; letter-spacing: .28em; text-transform: uppercase; }
    .nav-links { display: flex; align-items: center; gap: 32px; }
    .nav-links a, .header-phone { font-size: 10px; font-weight: 600; letter-spacing: .14em; text-decoration: none; text-transform: uppercase; transition: opacity .2s ease; }
    .nav-links a:hover, .header-phone:hover { opacity: .62; }
    .header-phone { justify-self: end; }
    .menu-toggle { display: none; justify-self: end; width: 38px; height: 38px; padding: 10px 4px; border: 0; background: transparent; color: inherit; cursor: pointer; }
    .menu-toggle span { display: block; width: 29px; height: 1px; margin: 6px 0; background: currentColor; transition: transform .25s ease, opacity .25s ease; }
    .hero { position: relative; display: grid; grid-template-columns: minmax(0, 1.02fr) minmax(410px, .98fr); min-height: min(900px, 100svh); overflow: hidden; color: #fff; background: var(--olive-dark); }
    .hero::before { position: absolute; inset: 0; z-index: 3; background: linear-gradient(90deg, rgba(24, 31, 23, .14), transparent 48%, rgba(24, 31, 23, .12)); content: ""; pointer-events: none; }
    .hero-copy { position: relative; z-index: 4; display: flex; flex-direction: column; justify-content: flex-end; padding: 190px clamp(36px, 6vw, 106px) 78px; background: radial-gradient(circle at 80% 20%, rgba(169, 175, 150, .18), transparent 35%), var(--olive-dark); }
    .hero-copy .display { max-width: 700px; font-size: clamp(72px, 8.5vw, 132px); }
    .hero-copy .display em { display: block; margin-left: .72em; }
    .hero-description { display: grid; grid-template-columns: 86px 1fr; gap: 25px; align-items: start; max-width: 540px; margin-top: 48px; }
    .hero-description::before { width: 100%; height: 1px; margin-top: 12px; background: rgba(255,255,255,.55); content: ""; }
    .hero-description p { max-width: 380px; margin: 0; color: rgba(255,255,255,.78); }
    .hero-actions { display: flex; gap: 28px; align-items: center; margin-top: 34px; }
    .hero-actions .text-link { color: #fff; }
    .hero-visual { position: relative; min-height: 630px; overflow: hidden; background: #e8ddd1; }
    .hero-visual img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.04); animation: settle 1.4s cubic-bezier(.2,.7,.2,1) both; }
    .hero-note { position: absolute; right: 28px; bottom: 28px; z-index: 5; max-width: 210px; padding: 18px 20px; border: 1px solid rgba(255,255,255,.55); background: rgba(43, 52, 40, .72); backdrop-filter: blur(10px); font-family: var(--serif); font-size: 19px; font-style: italic; line-height: 1.25; }
    .scroll-mark { position: absolute; bottom: 78px; left: 24px; z-index: 5; display: flex; align-items: center; gap: 14px; font-size: 8px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; transform: rotate(-90deg); transform-origin: left bottom; }
    .scroll-mark::before { width: 42px; height: 1px; background: currentColor; content: ""; }
    @keyframes settle { from { opacity: 0; transform: scale(1.12); } to { opacity: 1; transform: scale(1.04); } }

    .intro { display: grid; grid-template-columns: minmax(160px, .52fr) minmax(0, 1.35fr) minmax(220px, .62fr); gap: 7vw; width: min(100% - 72px, 1280px); margin: 0 auto; padding: 145px 0 155px; }
    .intro .section-title { max-width: 730px; }
    .intro-text { align-self: end; padding-bottom: 8px; }
    .intro-text p { margin: 0 0 28px; color: rgba(31,38,30,.7); }
    .signature { margin-top: 38px; font-family: var(--serif); font-size: 26px; font-style: italic; }
    .collections { padding: 0 0 150px; }
    .section-heading { display: flex; align-items: end; justify-content: space-between; gap: 30px; width: min(100% - 72px, 1440px); margin: 0 auto 54px; }
    .collection-grid { display: grid; grid-template-columns: 1.05fr .72fr 1.12fr; gap: 20px; width: min(100% - 72px, 1440px); margin: 0 auto; }
    .collection-card { position: relative; min-height: 560px; overflow: hidden; color: #fff; text-decoration: none; background: var(--sage); }
    .collection-card:nth-child(2) { min-height: 480px; margin-top: 80px; }
    .collection-card img { width: 100%; height: 100%; object-fit: cover; transition: transform .7s cubic-bezier(.2,.7,.2,1); }
    .collection-card::after { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 47%, rgba(24,31,23,.62)); content: ""; }
    .collection-card:hover img { transform: scale(1.035); }
    .collection-meta { position: absolute; right: 30px; bottom: 28px; left: 30px; z-index: 2; display: flex; align-items: end; justify-content: space-between; gap: 20px; }
    .collection-meta h3 { margin: 0; font-family: var(--serif); font-size: clamp(30px, 3vw, 46px); font-weight: 400; line-height: .95; }
    .collection-meta span { font-size: 10px; letter-spacing: .13em; text-transform: uppercase; }
    .statement { position: relative; display: grid; grid-template-columns: .84fr 1.16fr; min-height: 760px; color: #fff; background: var(--olive-dark); }
    .statement-art { min-height: 600px; overflow: hidden; background: #eee7de; }
    .statement-art img { width: 100%; height: 100%; object-fit: cover; }
    .statement-copy { display: flex; flex-direction: column; justify-content: center; padding: 90px clamp(38px, 8vw, 140px); }
    .statement-copy .section-title { max-width: 660px; }
    .statement-copy p { max-width: 510px; margin: 38px 0 34px; color: rgba(255,255,255,.68); }
    .statement-copy .text-link { width: max-content; color: #fff; }
    .statement-index { position: absolute; top: 34px; right: 38px; font-family: var(--serif); font-size: 16px; font-style: italic; }
    .products { padding: 150px 0; }
    .product-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 26px 20px; width: min(100% - 72px, 1440px); margin: 0 auto; }
    .product { grid-column: span 4; }
    .product:nth-child(2) { margin-top: 90px; }
    .product:nth-child(3) { margin-top: 22px; }
    .product-image { position: relative; aspect-ratio: .84; overflow: hidden; background: #ece7df; }
    .product-image img { width: 100%; height: 100%; object-fit: cover; transition: transform .6s cubic-bezier(.2,.7,.2,1); }
    .product:hover .product-image img { transform: scale(1.025); }
    .product-info { padding-top: 22px; }
    .product-info h3 { margin: 0 0 8px; font-family: var(--serif); font-size: 32px; font-weight: 400; line-height: 1; }
    .product-info p { min-height: 46px; margin: 0 0 14px; color: rgba(31,38,30,.68); font-size: 13px; }
    .product-price { font-size: 12px; font-weight: 600; letter-spacing: .08em; }
    .product .button { margin-top: 16px; }
    .footer { padding: 100px 36px 35px; background: var(--olive-dark); color: #fff; }
    .footer-inner { display: grid; grid-template-columns: 1.5fr 1fr 1fr; gap: 50px; width: min(100%, 1440px); margin: 0 auto; }
    .footer h2 { margin: 0 0 25px; font-family: var(--serif); font-size: 48px; font-weight: 400; line-height: .95; }
    .footer a { text-decoration: none; }
    .footer a:hover { text-decoration: underline; }
    .footer-meta { display: flex; justify-content: space-between; gap: 20px; width: min(100%, 1440px); margin: 80px auto 0; padding-top: 20px; border-top: 1px solid rgba(255,255,255,.18); font-size: 10px; color: rgba(255,255,255,.55); }
    .modal-backdrop { position: fixed; inset: 0; z-index: 100; display: none; align-items: center; justify-content: center; padding: 20px; background: rgba(19,24,18,.62); backdrop-filter: blur(6px); }
    .modal-backdrop.is-open { display: flex; }
    .order-modal { width: min(100%, 720px); max-height: calc(100svh - 40px); overflow-y: auto; padding: 34px; background: var(--paper-light); box-shadow: 0 20px 70px rgba(0,0,0,.25); }
    .modal-head { display: flex; justify-content: space-between; gap: 20px; align-items: flex-start; margin-bottom: 28px; }
    .modal-head h2 { margin: 0; font-family: var(--serif); font-size: 42px; font-weight: 400; line-height: .95; }
    .modal-close { width: 40px; height: 40px; border: 1px solid var(--line); background: transparent; cursor: pointer; }
    .order-summary { margin-bottom: 25px; padding: 15px; border: 1px solid var(--line); }
    .order-form { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .order-form label { display: flex; flex-direction: column; gap: 7px; font-size: 10px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
    .order-form .full { grid-column: 1 / -1; }
    .order-form input, .order-form textarea, .order-form select { width: 100%; border: 1px solid var(--line); border-radius: 0; background: #fff; color: var(--ink); font: inherit; padding: 13px 14px; }
    .order-form textarea { min-height: 100px; resize: vertical; }
    .form-message { min-height: 22px; margin: 12px 0 0; font-size: 12px; }
    .form-message.error { color: #9d3b32; }
    .form-message.success { color: #3e6845; }
    @media (max-width: 900px) and (min-width: 761px) {
      .header-inner, .intro, .section-heading, .collection-grid, .product-grid { width: calc(100% - 48px); }
      .nav-links { gap: 16px; }
      .hero-copy { padding-left: 36px; padding-right: 36px; }
      .hero-copy .display { font-size: clamp(60px, 8vw, 90px); }
    }
    @media (max-width: 760px) {
      .header-inner { width: calc(100% - 36px); }
      .nav-links { display: none; }
      .menu-toggle { display: block; }
      .hero { grid-template-columns: 1fr; min-height: auto; }
      .hero-copy { min-height: 640px; padding: 130px 18px 48px; }
      .hero-copy .display { font-size: clamp(54px, 16vw, 78px); }
      .hero-visual { min-height: 80vw; height: 80vw; }
      .intro { display: block; width: calc(100% - 36px); padding: 80px 0; }
      .intro-text { margin-top: 30px; }
      .collection-grid { grid-template-columns: 1fr; width: calc(100% - 36px); }
      .collection-card, .collection-card:nth-child(2) { min-height: 420px; margin-top: 0; }
      .statement { grid-template-columns: 1fr; }
      .statement-art { min-height: 95vw; }
      .statement-copy { padding: 70px 18px; }
      .product-grid { grid-template-columns: 1fr; width: calc(100% - 36px); }
      .product { grid-column: auto; margin-top: 0 !important; }
      .order-modal { padding: 24px 18px; }
      .order-form { grid-template-columns: 1fr; }
      .order-form .full { grid-column: auto; }
      .footer-inner { grid-template-columns: 1fr; }
      .footer-meta { flex-direction: column; }
    }
    @media (max-width: 390px) {
      .hero-copy { min-height: 575px; }
      .hero-copy .display { font-size: 52px; }
      .collection-card, .collection-card:nth-child(2) { min-height: 380px; }
    }
  </style>
</head>
