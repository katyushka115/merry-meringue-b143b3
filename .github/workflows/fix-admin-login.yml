name: Fix admin login
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin login guard
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('admin-panel.html')
          s=p.read_text()
          old="async function admin(){const r=await db.rpc('is_admin');if(r.error||r.data!==true)throw new Error(r.error?.message||'Нет прав администратора');return(await db.auth.getUser()).data.user}"
          new="async function admin(){const r=await db.auth.getUser();if(r.error||!r.data.user)throw new Error(r.error?.message||'Не удалось получить авторизованного пользователя');return r.data.user}"
          if old not in s:
              raise SystemExit('expected admin guard not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add admin-panel.html
          git commit -m "Fix admin login session guard" || exit 0
          git push
