name: Fix admin auth client
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin login to use server auth endpoint
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('admin-panel.html')
          s=p.read_text()
          old="$('loginMsg').textContent='Выполняется вход…';try{const r=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(r.error)throw r.error;if(!r.data?.user)throw new Error('Supabase не вернул пользователя после входа');await show(r.data.user)}catch(e){$('loginMsg').textContent=e.message}"
          new="$('loginMsg').textContent='Выполняется вход…';try{const response=await fetch('/.netlify/functions/admin-auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'Не удалось войти');if(!data.access_token||!data.refresh_token)throw new Error('Сервис авторизации не вернул сессию');const sessionResult=await db.auth.setSession({access_token:data.access_token,refresh_token:data.refresh_token});if(sessionResult.error)throw sessionResult.error;await show(sessionResult.data.user||data.user)}catch(e){$('loginMsg').textContent=e.message}"
          if old not in s:
              raise SystemExit('Expected login handler was not found; no change made')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit patched admin panel
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-panel.html
          git commit -m 'Fix admin login through server auth endpoint'
          git push
      - name: Remove one-time workflow
        if: success()
        run: |
          git rm .github/workflows/fix-admin-auth-client.yml
          git commit -m 'Remove one-time admin auth patch workflow'
          git push
