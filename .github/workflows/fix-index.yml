name: Fix frontend bootstrap

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace("const SUPABASE_KEY = sb_publishable_3FgdTAmKB8kw2QTrrVPA5g_vb1lya1d;", "const SUPABASE_KEY = 'sb_publishable_3FgdTAmKB8kw2QTrrVPA5g_vb1lya1d';")
          s = s.replace("<<div class=\"product-grid\"", "<div class=\"product-grid\"")
          p.write_text(s)
          PY
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix frontend Supabase bootstrap"
          git push
