name: Fix admin auth origin
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove proxy from admin Supabase client
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('admin-panel.html')
          s = p.read_text(encoding='utf-8')
          marker = "supabase.createClient(location.origin+'/supabase',"
          replacement = "supabase.createClient('https://avlozhwwvjqiypifoxox.supabase.co',"
          if marker not in s:
              raise SystemExit('Expected admin Supabase proxy origin was not found; refusing to change file.')
          p.write_text(s.replace(marker, replacement, 1), encoding='utf-8')
          PY
      - name: Commit fix and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-panel.html
          git rm .github/workflows/fix-admin-auth-origin.yml
          git commit -m 'Bypass Supabase proxy for admin auth'
          git push