name: Bust index asset cache

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bust:
    if: ${{ !contains(github.event.head_commit.message, '[cache-busted]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh asset URLs in index
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('assets/site-content-loader.js?v=20260817-2', 'assets/site-content-loader.js?v=20260823-4')
          s = s.replace('assets/order-flow.js?v=20260815-2', 'assets/order-flow.js?v=20260823-4')
          p.write_text(s)
          PY
      - name: Commit cache-busted index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Bust cached index asset URLs [cache-busted]'
          git push
