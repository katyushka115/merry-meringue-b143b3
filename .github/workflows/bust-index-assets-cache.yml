name: Bust index asset cache

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bust:
    if: ${{ !contains(github.event.head_commit.message, '[cache-busted]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make public index independent of blocked third-party CDNs
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          lines = s.splitlines()
          lines = [line for line in lines if 'fonts.googleapis.com' not in line and 'fonts.gstatic.com' not in line]
          s = '\n'.join(lines) + ('\n' if s.endswith('\n') else '')
          s = s.replace('assets/site-content-loader.js?v=20260817-2', 'assets/site-content-loader.js?v=20260823-4')
          s = s.replace('assets/order-flow.js?v=20260815-2', 'assets/order-flow.js?v=20260823-4')
          # Never block HTML parsing on jsDelivr. The public site uses the same-origin
          # site-content-loader and same-origin order proxy instead.
          s = s.replace('  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>\n', '')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit cache-busted index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Make production index independent of third-party CDN [cache-busted]'
          git push
