name: One-time admin auth repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair every live admin entry point
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('admin-panel.html')
          s = p.read_text()
          old = "if(r.error)throw r.error;await show(await admin())"
          new = "if(r.error)throw r.error;if(!r.data?.user)throw new Error('Supabase не вернул пользователя после входа');await show(r.data.user)"
          if old not in s:
              raise SystemExit('admin-panel login handoff not found; refusing to modify')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('admin-fixed.html')
          s = p.read_text()
          old = "async function isAdmin(){const r=await db.rpc('is_admin');if(r.error)throw r.error;if(r.data!==true)throw new Error('Нет прав администратора');return(await db.auth.getUser()).data.user}"
          new = "async function isAdmin(){const s=await db.auth.getSession();if(s.error||!s.data.session?.user)throw new Error(s.error?.message||'Сессия авторизации не найдена');return s.data.session.user}"
          if old not in s:
              raise SystemExit('admin-fixed auth guard not found; refusing to modify')
          s = s.replace(old, new, 1)
          p.write_text(s)

          wf = Path('.github/workflows/fix-admin-auth-session.yml')
          wf.unlink()
          PY
      - name: Commit repaired admin and remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add admin-panel.html admin-fixed.html .github/workflows/fix-admin-auth-session.yml
          git commit -m "Repair admin login in all live entry points"
          git push
