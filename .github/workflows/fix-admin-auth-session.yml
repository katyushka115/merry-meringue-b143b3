name: Fix admin auth session handoff
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch only the auth handoff
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('admin-panel.html')
          s=p.read_text()
          old="async function admin(){const r=await db.auth.getUser();if(r.error||!r.data.user)throw new Error(r.error?.message||'Не удалось получить авторизованного пользователя');return r.data.user}"
          new="async function admin(){const s=await db.auth.getSession();if(s.error||!s.data.session?.user)throw new Error(s.error?.message||'Сессия авторизации не найдена');return s.data.session.user}"
          if old not in s:
              raise SystemExit('Expected auth guard was not found; refusing to modify file')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add admin-panel.html
          git commit -m "Fix admin auth session handoff"
          git push
