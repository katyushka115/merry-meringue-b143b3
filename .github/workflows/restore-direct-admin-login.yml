name: Restore direct admin login
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore direct Supabase password login
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('admin-panel.html')
          s = p.read_text(encoding='utf-8')
          start = "$('loginForm').onsubmit=async e=>"
          a = s.find(start)
          if a < 0:
              raise SystemExit('login handler not found; refusing to modify admin-panel.html')
          b = s.find(";$('logout').onclick=", a)
          if b < 0:
              raise SystemExit('logout boundary not found; refusing to modify admin-panel.html')
          new = "$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginMsg').textContent='Выполняется вход…';try{const r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)throw r.error;if(!r.data.session||!r.data.user)throw new Error('Supabase не вернул сессию');await show(r.data.user)}catch(e){$('loginMsg').textContent=e.message}}"
          p.write_text(s[:a] + new + s[b:], encoding='utf-8')
          PY
      - name: Verify direct login is present
        run: |
          grep -F "db.auth.signInWithPassword" admin-panel.html
          ! grep -F "fetch('/.netlify/functions/admin-auth'" admin-panel.html
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-panel.html
          git rm .github/workflows/restore-direct-admin-login.yml
          git commit -m 'Restore direct Supabase admin login'
          git push