name: Fix admin session persistence

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Fix admin Supabase session persistence') && !contains(github.event.head_commit.message, 'Remove one-time admin session fix workflow') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch only the admin login session handoff
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('admin-panel.html')
          s = p.read_text()
          old = "localStorage.setItem('sb-avlozhwwvjqiypifoxox-auth-token',JSON.stringify(session));await show(data.user);location.reload()"
          new = "const sessionResult=await db.auth.setSession({access_token:data.access_token,refresh_token:data.refresh_token});if(sessionResult.error)throw sessionResult.error;await show(data.user);location.reload()"
          if old not in s:
              raise SystemExit('Expected admin login session handoff was not found; refusing to modify the file.')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit exact one-line fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-panel.html
          git commit -m 'Fix admin Supabase session persistence'
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/fix-admin-session.yml
          git commit -m 'Remove one-time admin session fix workflow'
          git push
