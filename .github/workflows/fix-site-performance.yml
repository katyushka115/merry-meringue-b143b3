name: Fix site performance and Supabase initialization

on:
  push:
    branches:
      - fix/supabase-singleton-and-performance

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply safe patches
        shell: python
        run: |
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')

          old = "const SUPABASE_URL='https://avlozhwwvjqiypifoxox.supabase.co';const SUPABASE_KEY='sb_publishable_3FgdTAmKB8kw2QTrrVPA5g_vb1lya1d';window.smSupabase=window.smSupabase||window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const supabase=window.smSupabase;"
          new = "const SUPABASE_URL='https://avlozhwwvjqiypifoxox.supabase.co';const SUPABASE_KEY='sb_publishable_3FgdTAmKB8kw2QTrrVPA5g_vb1lya1d';window.smSupabase=window.smSupabase||window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);"
          if old in text:
              text = text.replace(old, new, 1)

          text = text.replace("await supabase.from('products')", "await window.smSupabase.from('products')", 1)

          favicon = '  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2712%27 fill=%27%23354032%27/%3E%3Ctext x=%2732%27 y=%2743%27 text-anchor=%27middle%27 font-size=%2734%27 fill=%27white%27%3ES%3C/text%3E%3C/svg%3E">\n'
          if 'rel="icon"' not in text:
              text = text.replace('  <title>SM Flowers — авторская флористика в Москве</title>\n', '  <title>SM Flowers — авторская флористика в Москве</title>\n' + favicon, 1)

          index.write_text(text, encoding='utf-8')

          core = Path('assets/order-flow-core.js')
          core_text = core.read_text(encoding='utf-8')
          core_text = core_text.replace("    if (window.supabase?.createClient) { client = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY); return client; }\n    if (!window.__smSupabaseModulePromise) {\n      window.__smSupabaseModulePromise = import(SUPABASE_CDN).then(mod => {\n        const createClient = mod.createClient || mod.default?.createClient;\n        if (!createClient) throw new Error('Supabase SDK не загрузился');\n        return createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);\n      });\n    }\n    client = await window.__smSupabaseModulePromise;\n    window.smSupabase = client;\n    return client;", "    throw new Error('Supabase client is not initialized');")
          core.write_text(core_text, encoding='utf-8')

      - name: Commit patches
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/order-flow-core.js .github/workflows/fix-site-performance.yml
          git diff --cached --quiet && exit 0
          git commit -m "Fix duplicate Supabase initialization and browser loading errors"
          git push

# retrigger patch after workflow installation
