name: Fix admin syntax
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix only the malformed Set expression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('admin-panel.html')
          s = p.read_text(encoding='utf-8')
          old = "const present=[...new Set([...(t.data||[]).map(x=>x.section),...(m.data||[]).map(x=>x.section))]"
          new = "const present=[...new Set([...(t.data||[]).map(x=>x.section),...(m.data||[]).map(x=>x.section)])]"
          if old not in s:
              raise SystemExit('Target syntax was not found; refusing to modify the file')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          node --check <(sed -n 's#</script>.*##p' admin-panel.html) || true
          git diff --check
          git diff -- admin-panel.html
      - name: Commit exact fix and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/fix-admin-syntax.yml
          git add admin-panel.html .github/workflows/fix-admin-syntax.yml
          git commit -m 'Fix admin JavaScript syntax error'
          git push
