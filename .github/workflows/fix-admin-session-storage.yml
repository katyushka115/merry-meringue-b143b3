name: Fix admin session bootstrap
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin login session bootstrap
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('admin-panel.html')
          s = p.read_text()
          old = "const sessionResult=await db.auth.setSession({access_token:data.access_token,refresh_token:data.refresh_token});if(sessionResult.error)throw sessionResult.error;await show(sessionResult.data.user||data.user)"
          new = "const session={access_token:data.access_token,refresh_token:data.refresh_token,expires_in:Number(data.expires_in||3600),expires_at:Number(data.expires_at||Math.floor(Date.now()/1000)+Number(data.expires_in||3600)),token_type:data.token_type||'bearer',user:data.user};localStorage.setItem('sb-avlozhwwvjqiypifoxox-auth-token',JSON.stringify(session));await show(data.user);location.reload()"
          if old not in s:
              raise SystemExit('Expected session bootstrap code was not found; no change made')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-panel.html
          git commit -m 'Fix admin session bootstrap without proxy auth roundtrip'
          git push
      - name: Remove one-time workflow
        if: success()
        run: |
          git rm .github/workflows/fix-admin-session-storage.yml
          git commit -m 'Remove one-time admin session workflow'
          git push
