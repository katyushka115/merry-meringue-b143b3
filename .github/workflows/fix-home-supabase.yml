name: Fix home Supabase loader

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Supabase browser library before site script
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '    const SUPABASE_URL='
          cdn = '  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>\n'
          if cdn not in s:
              pos = s.find(marker)
              if pos < 0:
                  raise SystemExit('SUPABASE_URL marker not found')
              s = s[:pos] + cdn + s[pos:]
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
          grep -n 'supabase-js' index.html
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && echo 'No change needed' || git commit -m 'Fix home Supabase client loading'
          git push
      - name: Remove workflow after repair
        if: always()
        run: |
          git rm -f .github/workflows/fix-home-supabase.yml || true
          git commit -m 'Remove one-time home repair workflow' || true
          git push || true
