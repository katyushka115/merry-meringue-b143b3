name: Install site media admin

on:
  push:
    paths:
      - 'admin/site-editor/site-media-admin.js'
      - '.github/workflows/install-site-media-admin.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add site media editor to admin
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('admin/index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="site-editor/site-media-admin.js"></script>'
          if tag not in s:
              s = s.replace('</body>', tag + '</body>', 1)
          hide = '''<script>(function(){
            function hideLegacyTextEditor(){
              var tab=document.querySelector('.tabs [data-tab="texts"]');
              var section=document.getElementById('texts-tab');
              if(tab) tab.style.display='none';
              if(section) section.style.display='none';
            }
            if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',hideLegacyTextEditor);
            else hideLegacyTextEditor();
          })();</script>'''
          if 'hideLegacyTextEditor' not in s:
              s = s.replace('</body>', hide + '</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Integrate public site content loader
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          loader = '<script src="assets/site-content-loader.js?v=20260817-2"></script>'
          if 'assets/site-content-loader.js' not in s:
              marker = '<script src="assets/order-flow.js?v=20260815-2"></script>'
              if marker in s:
                  s = s.replace(marker, loader + '\n  ' + marker, 1)
              else:
                  s = s.replace('</body>', loader + '\n</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify public loader is present
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          if 'assets/site-content-loader.js' not in s:
              raise SystemExit('Public site loader is missing from index.html')
          print('Public site loader is present')
          PY
      - name: Commit integration changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/index.html index.html
          git diff --cached --quiet || git commit -m 'Connect public collections to Supabase content'
          git push
